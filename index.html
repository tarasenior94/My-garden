<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>My Garden — Life & Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --cream:#F8F6EF;
  --cream-2:#F1EEE3;
  --ink:#2E2B24;
  --ink-soft:#6B6455;
  --line:#E4DFD0;
  --card:#FFFFFF;
  --shadow: 0 8px 24px -12px rgba(64,54,32,0.18), 0 2px 6px -2px rgba(64,54,32,0.10);
  --shadow-sm: 0 2px 8px -4px rgba(64,54,32,0.15);
  --radius: 20px;
  --radius-sm: 14px;

  --dash:#5E7C57;   --dash-bg:#EAF0E4;
  --training:#3E6C8E; --training-bg:#E6EFF5;
  --sleep:#7C6F9E;  --sleep-bg:#EEEAF5;
  --cooking:#C1743B; --cooking-bg:#F7EADB;
  --meals:#D98A6B;  --meals-bg:#FAEBE3;
  --savings:#4F7A5B; --savings-bg:#E4F0E6;
  --period:#B6607D; --period-bg:#F6E4EA;
  --skin:#C97E92;   --skin-bg:#F8E9EE;
  --photo:#B8912B;  --photo-bg:#F6EFD9;
  --moral:#4C8177;  --moral-bg:#E2F0EC;
  --work:#33526B;   --work-bg:#E2E9EF;
  --routine:#7A8F5C; --routine-bg:#EDF1E3;

  --body:#3E6C8E;    --body-bg:#E6EFF5;
  --beauty:#C97E92;  --beauty-bg:#F8E9EE;
  --mind:#7C6F9E;    --mind-bg:#EEEAF5;
  --faith:#4C8177;   --faith-bg:#E2F0EC;
  --lifearea:#B8912B; --lifearea-bg:#F6EFD9;
  --relationships:#B6607D; --relationships-bg:#F6E4EA;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Karla',sans-serif; background:var(--cream); color:var(--ink);
  min-height:100vh; overscroll-behavior-y:none;
}
h1,h2,h3,.display{font-family:'Fraunces',serif; letter-spacing:-0.01em;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:16px;}
::-webkit-scrollbar{display:none;}

#app{max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:92px; position:relative;}

/* leaf background texture */
.leaf-bg{position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.5;}

.topbar{
  padding:22px 20px 14px; position:relative; z-index:1;
}
.topbar .greeting{font-size:13px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:0.08em;}
.topbar h1{font-size:26px; margin:2px 0 0; font-weight:600;}

.screen{padding:0 16px 8px; position:relative; z-index:1; animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* Progress card */
.progress-card{
  background:linear-gradient(135deg,var(--dash) 0%, #7A9B6F 100%);
  color:#fff; border-radius:var(--radius); padding:22px 22px 20px; margin:8px 0 18px;
  box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.progress-card svg.deco{position:absolute; right:-10px; top:-10px; opacity:0.18; width:120px; height:120px;}
.progress-card .label{font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; opacity:0.85;}
.progress-card .pct{font-family:'Fraunces',serif; font-size:40px; font-weight:600; margin:2px 0 10px;}
.bar-track{background:rgba(255,255,255,0.28); border-radius:20px; height:10px; overflow:hidden;}
.bar-fill{background:#fff; height:100%; border-radius:20px; transition:width .5s ease;}
.progress-card .count{font-size:13px; opacity:0.9; margin-top:8px;}

/* Section labels */
.section-title{font-size:15px; font-weight:700; margin:22px 4px 10px; display:flex; align-items:center; gap:8px;}
.section-title .rule{flex:1; height:1px; background:var(--line);}

/* Quick actions grid */
.qa-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.qa-btn{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:14px 6px 10px; text-align:center; box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .12s ease;
}
.qa-btn:active{transform:scale(0.95);}
.qa-btn .emoji{font-size:22px;}
.qa-btn .lbl{font-size:11.5px; font-weight:600; color:var(--ink-soft); line-height:1.2;}
.qa-btn.done{opacity:0.55;}

/* Focus checklist */
.focus-block{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:14px 16px; margin-bottom:12px; border:1px solid var(--line);}
.focus-block h4{margin:0 0 8px; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); display:flex; align-items:center; justify-content:space-between;}
.check-row{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--cream-2); cursor:pointer; min-height:24px;}
.check-row:last-child{border-bottom:none;}
.check-row:active{background:var(--cream-2); border-radius:10px;}
.check-row input[type=checkbox]{width:22px; height:22px; accent-color:var(--dash); flex-shrink:0;}
.check-row label, .check-row .check-row-text{font-size:15px; flex:1; line-height:1.4;}
.check-row.checked label, .check-row.checked .check-row-text{color:var(--ink-soft); text-decoration:line-through;}
.check-row .del{color:#B98; font-size:12px; opacity:0.6; padding:8px; min-height:32px; display:inline-flex; align-items:center;}
.add-item-row{display:flex; gap:8px; margin-top:8px;}
.add-item-row input{flex:1; border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:14px;}
.add-item-row button{border:none; background:var(--cream-2); border-radius:10px; padding:8px 12px; font-size:13px; font-weight:700; color:var(--ink-soft);}

/* insight strip */
.insight{
  display:flex; gap:10px; align-items:flex-start; background:var(--dash-bg); color:var(--dash);
  border-radius:14px; padding:11px 13px; margin-bottom:8px; font-size:13.5px; font-weight:600; line-height:1.4;
}
.insight .ic{font-size:16px;}

/* Life cards */
.life-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.life-card{
  border-radius:var(--radius); padding:16px 14px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden;
  min-height:96px; display:flex; flex-direction:column; justify-content:space-between; border:1px solid rgba(0,0,0,0.03);
}
.life-card .emoji{font-size:24px;}
.life-card .name{font-weight:700; font-size:14.5px; margin-top:6px;}
.life-card .sub{font-size:11.5px; font-weight:600; opacity:0.75; margin-top:2px;}

/* Area cards (Becoming) */
.area-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.area-card{
  border-radius:var(--radius-sm); padding:14px 8px 12px; box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column; align-items:center; gap:4px; border:1px solid rgba(0,0,0,0.03); text-align:center;
}
.area-card .emoji{font-size:22px;}
.area-card .name{font-weight:700; font-size:12px;}

/* Season banner */
.season-card{
  background:var(--card); border:1.5px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin:0 0 16px;
  box-shadow:var(--shadow-sm);
}
.season-card .tag{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-soft);}
.season-card h3{margin:3px 0 6px; font-size:17px;}
.season-card p{font-size:13px; color:var(--ink-soft); margin:0 0 10px; line-height:1.5;}

/* Journey timeline */
.timeline-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--cream-2);}
.timeline-item:last-child{border-bottom:none;}
.timeline-dot{width:34px; height:34px; border-radius:50%; background:var(--cream-2); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
.timeline-body .main{font-size:14.5px; font-weight:600;}
.timeline-body .meta{font-size:11px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:0.03em; margin-top:2px;}

/* generic card / list */
.card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-sm); border:1px solid var(--line); padding:16px; margin-bottom:12px;}
.stat-row{display:flex; gap:10px;}
.stat{flex:1; background:var(--cream-2); border-radius:12px; padding:10px 10px; text-align:center;}
.stat .n{font-family:'Fraunces',serif; font-size:20px; font-weight:600;}
.stat .l{font-size:10.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:0.04em;}

.entry-item{padding:10px 0; border-bottom:1px solid var(--cream-2); display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
.entry-item:last-child{border-bottom:none;}
.entry-item .meta{font-size:11px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:0.03em;}
.entry-item .main{font-size:14.5px; margin-top:2px;}
.entry-item .sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.entry-actions button{border:none; background:none; font-size:13px; color:var(--ink-soft); padding:4px;}

.empty-state{text-align:center; padding:26px 10px; color:var(--ink-soft);}
.empty-state .e{font-size:30px; margin-bottom:6px;}
.empty-state p{font-size:13.5px; margin:2px 0; line-height:1.5;}

/* forms */
.form-field{margin-bottom:12px;}
.form-field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.03em;}
.form-field input[type=text], .form-field input[type=number], .form-field input[type=date], .form-field input[type=time], .form-field textarea, .form-field select{
  width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 13px; background:var(--cream); font-size:15px; color:var(--ink);
}
.form-field textarea{min-height:80px; resize:vertical;}
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip{border:1.5px solid var(--line); border-radius:20px; padding:8px 14px; font-size:13.5px; font-weight:600; background:var(--cream); color:var(--ink-soft);}
.chip.active{border-color:var(--dash); background:var(--dash-bg); color:var(--dash);}
.slider-row{display:flex; align-items:center; gap:10px;}
.slider-row input[type=range]{flex:1; accent-color:var(--dash);}
.slider-val{font-family:'Fraunces',serif; font-weight:600; font-size:17px; width:26px; text-align:center;}

.btn-primary{
  width:100%; background:var(--dash); color:#fff; border:none; border-radius:14px; padding:14px; font-size:15.5px; font-weight:700;
  box-shadow:0 6px 16px -6px rgba(94,124,87,0.55); margin-top:4px;
}
.btn-primary:active{transform:scale(0.98);}
.btn-secondary{
  width:100%; background:var(--cream-2); color:var(--ink-soft); border:none; border-radius:14px; padding:13px; font-size:14.5px; font-weight:700; margin-top:8px;
}
.btn-ghost{background:none; border:none; color:var(--ink-soft); font-size:14px; font-weight:600; padding:6px 0;}

/* nav header w/ back */
.nav-header{display:flex; align-items:center; gap:10px; padding:18px 16px 10px; position:relative; z-index:1;}
.back-btn{width:40px; height:40px; border-radius:50%; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:16px; box-shadow:var(--shadow-sm); flex-shrink:0;}
/* Consistent small action buttons (edit/delete/archive/move icons) — kept visually quiet but with a real touch target */
.icon-btn{border:none; background:none; color:var(--ink-soft); font-size:15px; min-width:36px; min-height:36px; display:inline-flex; align-items:center; justify-content:center; border-radius:10px; padding:0; flex-shrink:0;}
.icon-btn:active{background:var(--cream-2);}
.icon-btn[disabled]{opacity:0.3;}
.nav-header h2{margin:0; font-size:20px; font-weight:600;}

/* bottom nav */
.bottomnav{
  position:fixed; bottom:0; left:0; right:0; z-index:20;
  background:rgba(248,246,239,0.92); backdrop-filter:blur(14px); border-top:1px solid var(--line);
  display:flex; justify-content:space-around; padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  max-width:520px; margin:0 auto;
}
.nav-btn{display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; color:var(--ink-soft); font-size:10.5px; font-weight:700; padding:6px 10px; border-radius:12px;}
.nav-btn .ic{font-size:20px;}
.nav-btn.active{color:var(--dash);}
.nav-btn.active .ic{transform:translateY(-1px);}

/* modal */
.modal-overlay{position:fixed; inset:0; background:rgba(46,43,36,0.45); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
.modal-sheet{background:var(--cream); width:100%; max-width:520px; border-radius:24px 24px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; animation:slideUp .25s ease;}
@keyframes slideUp{from{transform:translateY(30px); opacity:0.6;} to{transform:translateY(0); opacity:1;}}
.modal-sheet h3{margin:0 0 14px; font-size:19px;}
.modal-close{position:absolute; top:14px; right:18px; background:var(--card); border:1px solid var(--line); border-radius:50%; width:38px; height:38px; font-size:14px; color:var(--ink-soft); display:flex; align-items:center; justify-content:center;}

/* Toast feedback — brief, quiet confirmation, no modal interruption */
.toast{
  position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(10px);
  background:var(--ink); color:#fff; font-size:13.5px; font-weight:600; padding:10px 18px;
  border-radius:20px; box-shadow:0 8px 20px -6px rgba(0,0,0,0.35); z-index:200; opacity:0;
  transition:opacity .25s ease, transform .25s ease; pointer-events:none; max-width:86%; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* celebration */
.celebrate{background:linear-gradient(135deg,#F6EFD9,#F8F6EF); text-align:center; padding:30px 20px;}
.celebrate .big{font-size:44px;}
.celebrate h3{margin:10px 0 4px;}
.celebrate p{color:var(--ink-soft); font-size:14px; line-height:1.5;}
.reward-box{background:var(--card); border-radius:16px; padding:16px; margin-top:14px; border:1.5px dashed var(--photo);}

.limitation{font-size:12px; color:var(--ink-soft); background:var(--cream-2); border-radius:12px; padding:10px 12px; margin-top:10px; line-height:1.5;}
.day-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px;}
.day-tabs button{flex-shrink:0; border:1.5px solid var(--line); background:var(--card); border-radius:12px; padding:7px 12px; font-size:12.5px; font-weight:700; color:var(--ink-soft);}
.day-tabs button.active{background:var(--routine); color:#fff; border-color:var(--routine);}
</style>
</head>
<body>
<svg class="leaf-bg" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs></defs>
</svg>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- storage helpers ----------------
   REBUILT: this app no longer uses the Claude "window.storage" bridge at all —
   that was the actual point of failure ("Storage set failed: Unexpected response
   type"), not anything in this app's logic. Persistence now uses the browser's
   own localStorage, which lives entirely on your device and has zero dependency
   on any Anthropic service. If localStorage itself isn't available in whatever
   is rendering this page (e.g. a heavily sandboxed in-app webview), the app
   detects that up front and tells you plainly, plus falls back to keeping your
   data in memory for the session with auto-backup downloads, so you're never
   silently losing data even in that worst case. */
const KEYS = ["routine","checklist","spending","income","meals","workouts","sleep","cooking","reading","skincare","period","photos","work","savings","goals","achievements","settings","bodyMeasurements","fitnessPhotos","skinPhotos","skinRoutine","proudMoments","weeklyReflections","bestVersion","weeklyCheckins","seasons","identityStatements","relationships","customRoutines","progressPhotos","milestones"];
let DB = {};
let loaded = false;
let localStorageOK = false;

function probeLocalStorage(){
  try{
    const testKey = '__mygarden_probe__';
    localStorage.setItem(testKey, '1');
    const ok = localStorage.getItem(testKey) === '1';
    localStorage.removeItem(testKey);
    return ok;
  }catch(e){
    console.error('localStorage unavailable:', e);
    return false;
  }
}

function loadAll(){
  localStorageOK = probeLocalStorage();
  for(const k of KEYS){
    if(localStorageOK){
      try{
        const raw = localStorage.getItem('db:'+k);
        DB[k] = raw!==null ? JSON.parse(raw) : defaultFor(k);
      }catch(e){ console.error('load failed for key "'+k+'":', e); DB[k] = defaultFor(k); }
    } else {
      DB[k] = defaultFor(k); // in-memory only this session; see storageBroken banner
    }
  }
  loaded = true;
}
function defaultFor(k){
  if(k==='routine') return {
    morning:["Breakfast","Shower","Morning Skincare","Morning reading","Pray"],
    workday:["Arrive at work","Lunch break"],
    eveningByDay:{0:["Dinner","Evening Skincare"],1:["Dinner","Workout","Evening Skincare"],2:["Dinner","Evening Skincare"],3:["Dinner","Workout","Evening Skincare"],4:["Dinner","Evening Skincare"],5:["Dinner","Photo of the Day"],6:["Dinner","Photo of the Day","Evening Skincare"]}
  };
  if(k==='checklist') return {};
  if(k==='goals') return [];
  if(k==='achievements') return [];
  if(k==='settings') return {name:"", pin:"", locked:false};
  if(k==='skinRoutine') return { am:["Cleanser","Moisturiser","SPF"], pm:["Cleanser","Treatment","Moisturiser"] };
  if(k==='seasons') return [
    { id:uid(), number:1, name:"Foundation", focus:"Building the habits and routines that everything else grows from.", start:"2026-10-02", end:"2026-12-30", status:"active" }
  ];
  if(k==='identityStatements') return [];
  if(k==='relationships') return [];
  if(k==='customRoutines') return [];
  if(k==='progressPhotos') return [];
  if(k==='milestones') return [];
  return [];
}
let storageBroken = false;
let backupReminderDismissed = false;
let lastAutoBackupAt = 0;
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function save(k){
  if(!localStorageOK){
    // local storage itself isn't available in this viewer — keep working in memory
    // and lean on auto-backup so nothing is lost, but don't pretend it's saved.
    storageBroken = true;
    const now = Date.now();
    if(now - lastAutoBackupAt > 60000){ lastAutoBackupAt = now; try{ doExport('safety'); }catch(_){} }
    return;
  }
  try{
    const toPersist = Array.isArray(DB[k])
      ? DB[k].map(it => (it && typeof it==='object' && '_pending' in it) ? (({_pending,_error,...clean})=>clean)(it) : it)
      : DB[k];
    localStorage.setItem('db:'+k, JSON.stringify(toPersist));
    storageBroken = false;
  }catch(e){
    // e.g. QuotaExceededError, or storage revoked mid-session
    console.error('save failed for key "'+k+'":', e);
    storageBroken = true;
    const now = Date.now();
    if(now - lastAutoBackupAt > 60000){ lastAutoBackupAt = now; try{ doExport('safety'); }catch(_){} }
    throw e;
  }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }
function dayIdx(iso){ return new Date(iso+'T00:00:00').getDay(); }

/* ---------------- charts ---------------- */
const chartInstances = {};
function renderChart(canvasId, type, labels, datasets, opts){
  const el = document.getElementById(canvasId);
  if(!el || typeof Chart==='undefined') return;
  if(chartInstances[canvasId]){ chartInstances[canvasId].destroy(); }
  chartInstances[canvasId] = new Chart(el.getContext('2d'), {
    type,
    data: { labels, datasets },
    options: Object.assign({
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display: datasets.length>1, labels:{ font:{family:'Karla'}, color:'#6B6455' } } },
      scales: type==='pie'||type==='doughnut' ? {} : {
        x:{ ticks:{ font:{family:'Karla', size:10}, color:'#6B6455' }, grid:{ display:false } },
        y:{ ticks:{ font:{family:'Karla', size:10}, color:'#6B6455' }, grid:{ color:'#E4DFD0' }, beginAtZero:true }
      }
    }, opts||{})
  });
}
function chartCanvas(id, heightPx){
  return `<div style="position:relative; height:${heightPx||180}px; margin-top:10px;"><canvas id="${id}"></canvas></div>`;
}

/* ---------------- image handling (Photo of the Day, Fitness/Skin progress photos) ----------------
   Images are downscaled + JPEG-compressed client-side before being stored, since localStorage has a
   small quota (commonly ~5MB total). This keeps each photo roughly 20-100KB so a reasonable number
   fit without silently blowing the quota. */
function compressImageFile(file, maxDim){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('Could not read that image file.'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('Could not decode that image.'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        const dim = maxDim || 640;
        if(w>h && w>dim){ h = Math.round(h*dim/w); w = dim; }
        else if(h>=w && h>dim){ w = Math.round(w*dim/h); h = dim; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function estimateStorageUsageKB(){
  if(!localStorageOK) return 0;
  let total=0;
  try{
    for(const k of KEYS){
      const v = localStorage.getItem('db:'+k);
      if(v) total += v.length;
    }
  }catch(e){}
  return Math.round(total/1024);
}

function todaysRoutineItems(){

  const dIdx = dayIdx(iso);

  const isWeekday = dIdx>=1 && dIdx<=5; // Mon(1)-Fri(5)
  return {

function checklistKey(section,item){ return section+'::'+item; }
function toggleCheck(key){

function computeProgress(){
  const {morning,workday,evening} = todaysRoutineItems();
  const all = [...morning.map(i=>checklistKey('morning',i)), ...workday.map(i=>checklistKey('workday',i)), ...evening.map(i=>checklistKey('evening',i))];
  const c = getChecklistFor(todayISO());
  const done = all.filter(k=>c[k]).length;
  return {done, total:all.length, pct: all.length? Math.round(done/all.length*100):0};

/* auto-check routine items when a matching quick action is logged today.
   Section-aware: only checks items within the given sections (or all sections if none given),
   so e.g. logging AM skincare never touches the PM skincare item and vice versa. */
function autoCheckMatching(keywords, onlySections){
  const iso = todayISO();
  const c = getChecklistFor(iso);
  const {morning,workday,evening} = todaysRoutineItems();
  const sections = [['morning',morning],['workday',workday],['evening',evening]].filter(([s])=> !onlySections || onlySections.includes(s));
  sections.forEach(([section,items])=>{
    items.forEach(item=>{
      const low = item.toLowerCase();
      if(keywords.some(k=>low.includes(k))) c[checklistKey(section,item)]=true;
    });
  });
  save('checklist');
}

function goalCurrent(g){
  if(g.section && g.metricKey && GOAL_METRICS[g.section] && GOAL_METRICS[g.section][g.metricKey]){
    const metric = GOAL_METRICS[g.section][g.metricKey];
    const ctx = g.type==='frequency' ? {range: weekRange()} : {};
    return metric.fn(g.param, ctx);
  }
  if(g.linkedSource && GOAL_SOURCES[g.linkedSource]) return GOAL_SOURCES[g.linkedSource](); // v1 goals keep working unchanged
  return g.current||0;
}
function nextMilestone(current, target){
  if(!target || target<=current) return null;
  let step = (target-current)/5;
  if(step>=1000) step = Math.round(step/1000)*1000;
  else if(step>=100) step = Math.round(step/100)*100;
  else if(step>=10) step = Math.round(step/10)*10;
  else step = Math.max(1, Math.round(step));
  let m = current+step;
  if(m>=target) m = target;
  return m;
}
function checkGoalCompletion(){
  let newly=[];
  DB.goals.forEach(g=>{
    const cur = goalCurrent(g);
    if(!g.completed && g.target && cur>=Number(g.target)){
      g.completed=true;
      g.completedAt = new Date().toISOString();
      newly.push(g);
      addAchievement('goal:'+g.id, '🎯 Goal completed: '+g.name, {section:'Goals', icon:'🎯', description:'Reached the target for "'+g.name+'".'});
    }
  });
  if(newly.length){ save('goals'); showReward(newly[0]); return true; }
  return false;
}
function addAchievement(key, title, opts){
  opts = opts || {};
  if(DB.achievements.some(a=>a.key===key)) return; // idempotent — never grants the same milestone twice
  DB.achievements.unshift({id:uid(), key, title, date:todayISO(), section:opts.section||'', icon:opts.icon||'🏆', description:opts.description||''});
  save('achievements');
}

/* ---------------- streaks ---------------- */
function currentStreak(dates){
  const set = new Set(dates);
  let n=0; let d=new Date();
  while(true){
    const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(set.has(iso)){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}

/* ---------------- ON THIS DAY ---------------- */
function buildOnThisDay(){
  const cards = [];
  const offsets = [ {label:'6 months ago', months:6}, {label:'1 year ago', months:12}, {label:'2 years ago', months:24} ];
  const todayD = new Date();
  offsets.forEach(off=>{
    if(cards.length>=3) return;
    const target = new Date(todayD); target.setMonth(target.getMonth()-off.months);
    const targetISO = target.getFullYear()+'-'+String(target.getMonth()+1).padStart(2,'0')+'-'+String(target.getDate()).padStart(2,'0');

    const photo = DB.photos.find(p=>p.date===targetISO);
    if(photo && cards.length<3){ cards.push({type:'photo', label:off.label, photo}); }

    const nearCooking = DB.cooking.filter(c=> Math.abs(new Date(c.date+'T00:00:00')-new Date(targetISO+'T00:00:00')) <= 2*86400000);
    if(nearCooking.length && cards.length<3){
      const entry = nearCooking[0];
      const group = recipeGroups().find(g=>g.name.toLowerCase()===entry.recipe.trim().toLowerCase());
      if(group && group.count>1){
        const allAttempts = DB.cooking.filter(c=>c.recipe.trim().toLowerCase()===entry.recipe.trim().toLowerCase());
        const attemptNumber = allAttempts.filter(a=>a.date<=entry.date).length;
        cards.push({type:'cooking', label:off.label, entry, nowAvg:group.avg, attemptNumber});
      }
    }

    if(cards.length<3){
      const prAt = (cutoff)=>{
        const map = {};
        DB.workouts.filter(w=>w.date<=cutoff).forEach(w=>(w.exercises||[]).forEach(ex=>{
          if(!ex.name || ex.weight===undefined || ex.weight==='') return;
          const k = ex.name.trim().toLowerCase(); const v = Number(ex.weight);
          if(isNaN(v)) return;
          if(!map[k] || v>map[k].pr) map[k] = {pr:v, name:ex.name.trim()};
        }));
        return map;
      };
      const then = prAt(targetISO);
      const now = prAt(todayISO());
      for(const k in then){
        if(now[k] && now[k].pr > then[k].pr){
          cards.push({type:'training', label:off.label, name:then[k].name, then:then[k].pr, now:now[k].pr});
          break;
        }
      }
    }
  });
  return cards.slice(0,3);
}
function renderOnThisDay(){
  const cards = buildOnThisDay();
  if(!cards.length) return '';
  return `<div class="section-title">On This Day <div class="rule"></div></div>` + cards.map(c=>{
    if(c.type==='photo') return `<div class="card">
      <div class="meta" style="text-transform:uppercase;font-size:11px;font-weight:700;color:var(--photo);">🌱 ${esc(c.label)}</div>
      ${c.photo.photoData?`<img src="${c.photo.photoData}" style="width:100%;border-radius:14px;margin-top:8px;">`:''}
      ${c.photo.caption?`<p style="margin:8px 0 0;font-size:14px;line-height:1.5;">${esc(c.photo.caption)}</p>`:''}
    </div>`;
    if(c.type==='cooking') return `<div class="card">
      <div class="meta" style="text-transform:uppercase;font-size:11px;font-weight:700;color:var(--cooking);">🍳 ${esc(c.label)}</div>
      <p style="margin:8px 0 0;font-size:14px;line-height:1.5;">You cooked <strong>${esc(c.entry.recipe)}</strong>${c.attemptNumber?' for the '+ordinal(c.attemptNumber)+' time':''}. Your rating was ${c.entry.rating||'-'}/10.${c.entry.notes?' You wrote: "'+esc(c.entry.notes)+'"':''}</p>
      <p style="margin:6px 0 0;font-size:14px;color:var(--dash);font-weight:700;">Today your average for this recipe is ${c.nowAvg.toFixed(1)}/10.</p>
    </div>`;
    if(c.type==='training') return `<div class="card">

      <p style="margin:6px 0 0;font-size:14px;color:var(--dash);font-weight:700;">Today you're at ${c.now}kg. 🌱 Look how far you've come.</p>
    </div>`;
    return '';
  }).join('');
}
function ordinal(n){
  const s = ['th','st','nd','rd'], v = n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}

function attachLockHandlers(){
  const btn = document.getElementById('unlockBtn');
  const inp = document.getElementById('pinInput');
  const tryUnlock = ()=>{
    if(inp.value===DB.settings.pin){ DB.settings.locked=false; render(); }
    else document.getElementById('lockErr').textContent='Incorrect PIN';
  };
  btn.onclick = tryUnlock;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') tryUnlock(); });
  inp.focus();
}

let lastInsights = [];
function buildInsights(){
  const out=[];
  const iso = todayISO();
  const hour = new Date().getHours();
  const mealLogged = slot => DB.meals.some(m=>m.date===iso && (m.slot||'').toLowerCase()===slot);

  if(hour>=9 && !mealLogged('breakfast')) out.push({icon:'🍳', text:'Breakfast not logged yet.', action:{type:'qa', qa:'meal', slot:'breakfast'}});
  if(hour>=13 && !mealLogged('lunch')) out.push({icon:'🥗', text:'Lunch not logged yet.', action:{type:'qa', qa:'meal', slot:'lunch'}});
  if(hour>=19 && !mealLogged('dinner')) out.push({icon:'🍲', text:'Dinner not logged yet.', action:{type:'qa', qa:'meal', slot:'dinner'}});

  const readToday = DB.reading.some(r=>r.date===iso);
  if(hour>=9 && !readToday) out.push({icon:'📖', text:'Morning reading & prayer not logged yet.', action:{type:'qa', qa:'reading'}});

  const { evening } = todaysRoutineItems();
  const workoutPlanned = evening.some(e=>e.toLowerCase().includes('workout'));
  const hasWorkout = DB.workouts.some(w=>w.date===iso);
  if(workoutPlanned && hour>=16 && !hasWorkout) out.push({icon:'💪', text:"You planned a workout today — log it when you're done.", action:{type:'qa', qa:'workout'}});

  const hasPhoto = DB.photos.some(p=>p.date===iso);
  if(hour>=17 && !hasPhoto) out.push({icon:'📸', text:"Your Photo of the Day hasn't been logged yet.", action:{type:'qa', qa:'photo'}});

  const amSkinDone = DB.skincare.some(s=>s.date===iso && s.period==='am');
  const pmSkinDone = DB.skincare.some(s=>s.date===iso && s.period==='pm');
  if(hour>=9 && !amSkinDone) out.push({icon:'☀️', text:'Morning skincare not completed yet.', action:{type:'qa', qa:'skincare', period:'am'}});
  if(hour>=20 && !pmSkinDone) out.push({icon:'🌙', text:'Evening skincare not completed yet.', action:{type:'qa', qa:'skincare', period:'pm'}});

  if(hour>=20 && !DB.spending.some(sp=>sp.date===iso)) out.push({icon:'💰', text:"No spending logged today — add anything you spent (or you're all clear).", action:{type:'qa', qa:'spending'}});

  const readStreak = currentStreak(DB.reading.map(r=>r.date));
  if(readStreak>=3) out.push({icon:'🙏', text:`${readStreak}-day reading streak — great consistency!`});
  const overBudget = weeklyBudgetInfo();
  if(overBudget.remaining<0) out.push({icon:'💰', text:`You're $${Math.abs(overBudget.remaining).toFixed(0)} over this week's spending budget.`, action:{type:'life', key:'money'}});

  if(!out.length) out.push({icon:'🌱', text:"You're all caught up — beautifully done."});
  lastInsights = out.slice(0,6);
  return lastInsights;
}
function buildNeedsAttention(){
  const out=[];
  // sleep this week vs a healthy baseline (7h)
  const {start,end} = weekRange();
  const weekSleep = DB.sleep.filter(s=>s.date>=start && s.date<=end).map(s=>sleepDurationHours(s.bed,s.wake)).filter(d=>d!==null);
  if(weekSleep.length>=2){
    const avg = weekSleep.reduce((a,b)=>a+b,0)/weekSleep.length;
    const pct = Math.round(Math.min(100, avg/7.5*100));
    if(pct<80) out.push({icon:'😴', label:'Sleep this week', value:pct+'%', key:'sleep'});
  }
  const budget = weeklyBudgetInfo();
  if(budget.remaining<0) out.push({icon:'💰', label:'Spending', value:'$'+Math.abs(budget.remaining).toFixed(0)+' over', key:'money'});
  const photoGaps = (()=>{ let miss=0; for(let i=0;i<7;i++){ const d=new Date(); d.setDate(d.getDate()-i); const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if(!DB.photos.some(p=>p.date===iso)) miss++; } return miss; })();
  if(photoGaps>=3) out.push({icon:'📸', label:'Photography', value:photoGaps+' days missed', key:'photo'});
  const weekCooking = DB.cooking.filter(c=>c.date>=start && c.date<=end).length;
  if(weekCooking===0 && DB.cooking.length>0) out.push({icon:'🍳', label:'Cooking this week', value:'0 logged', key:'cooking'});
  return out.slice(0,4);
}

/* ---------------- Better Than Last Month ---------------- */
function buildComparisons(){
  const out=[];
  const now = new Date();
  const iso = d=> d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const thisMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const lastMonthStart = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const lastMonthEnd = new Date(now.getFullYear(), now.getMonth(), 0);
  const tS=iso(thisMonthStart), tE=iso(now), lS=iso(lastMonthStart), lE=iso(lastMonthEnd);

  const thisWorkouts = DB.workouts.filter(w=>w.date>=tS&&w.date<=tE).length;
  const lastWorkouts = DB.workouts.filter(w=>w.date>=lS&&w.date<=lE).length;
  if((thisWorkouts||lastWorkouts) && thisWorkouts!==lastWorkouts){
    const diff = thisWorkouts-lastWorkouts;
    out.push({icon:'💪', label:'Workouts', text:`${diff>0?'+':''}${diff} vs last month`, positive:diff>0});
  }

  const thisCooking = DB.cooking.filter(c=>c.date>=tS&&c.date<=tE);
  const lastCooking = DB.cooking.filter(c=>c.date>=lS&&c.date<=lE);
  if(thisCooking.length>=2 && lastCooking.length>=2){
    const thisAvg = thisCooking.reduce((s,c)=>s+Number(c.rating||0),0)/thisCooking.length;
    const lastAvg = lastCooking.reduce((s,c)=>s+Number(c.rating||0),0)/lastCooking.length;
    if(Math.abs(thisAvg-lastAvg)>=0.3) out.push({icon:'🍳', label:'Cooking average', text:`${thisAvg.toFixed(1)}/10 ${thisAvg>lastAvg?'↑':'↓'} from ${lastAvg.toFixed(1)}`, positive:thisAvg>lastAvg});
  }

  const daysThisMonthSoFar = now.getDate();
  const daysInLastMonth = lastMonthEnd.getDate();
  const thisReadDays = new Set(DB.reading.filter(r=>r.date>=tS&&r.date<=tE).map(r=>r.date)).size;
  const lastReadDays = new Set(DB.reading.filter(r=>r.date>=lS&&r.date<=lE).map(r=>r.date)).size;
  if(daysThisMonthSoFar>=5 && daysInLastMonth>=5){
    const thisPct = Math.round(thisReadDays/daysThisMonthSoFar*100);
    const lastPct = Math.round(lastReadDays/daysInLastMonth*100);
    const diff = thisPct-lastPct;
    if(Math.abs(diff)>=5) out.push({icon:'🙏', label:'Reading consistency', text:`${diff>0?'+':''}${diff}%`, positive:diff>0});
  }

  const thisSleep = DB.sleep.filter(s=>s.date>=tS&&s.date<=tE).map(s=>sleepDurationHours(s.bed,s.wake)).filter(d=>d!==null);
  const lastSleep = DB.sleep.filter(s=>s.date>=lS&&s.date<=lE).map(s=>sleepDurationHours(s.bed,s.wake)).filter(d=>d!==null);
  if(thisSleep.length>=3 && lastSleep.length>=3){
    const thisAvg = thisSleep.reduce((a,b)=>a+b,0)/thisSleep.length;
    const lastAvg = lastSleep.reduce((a,b)=>a+b,0)/lastSleep.length;
    if(Math.abs(thisAvg-lastAvg)>=0.3) out.push({icon:'😴', label:'Average sleep', text:`${thisAvg.toFixed(1)}h ${thisAvg>lastAvg?'↑':'↓'} from ${lastAvg.toFixed(1)}h`, positive:thisAvg>lastAvg});
  }
  return out.slice(0,4);
}

/* ---------------- Weekly budget calc ---------------- */
function weekRange(){
  const d = new Date();
  const day = d.getDay();
  const start = new Date(d); start.setDate(d.getDate()-day);
  const end = new Date(start); end.setDate(start.getDate()+6);
  const iso = x=> x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  return {start:iso(start), end:iso(end)};
}
function weeklyBudgetInfo(){
  const {start,end} = weekRange();
  const inRange = (d)=> d>=start && d<=end;
  const income = DB.income.filter(i=>inRange(i.date)).reduce((s,x)=>s+Number(x.amount||0),0);
  const savingsThisWeek = DB.savings.filter(s=>inRange(s.date)).reduce((s,x)=>s+Number(x.amount||0),0);
  let budget = income - savingsThisWeek;
  // overspend rule: pull last week's overspend into this week's budget reduction
  const lastWeekStart = new Date(start+'T00:00:00'); lastWeekStart.setDate(lastWeekStart.getDate()-7);
  const lastWeekEnd = new Date(start+'T00:00:00'); lastWeekEnd.setDate(lastWeekEnd.getDate()-1);
  const iso = x=> x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  const lwStart=iso(lastWeekStart), lwEnd=iso(lastWeekEnd);
  const lwIncome = DB.income.filter(i=>i.date>=lwStart&&i.date<=lwEnd).reduce((s,x)=>s+Number(x.amount||0),0);
  const lwSavings = DB.savings.filter(s=>s.date>=lwStart&&s.date<=lwEnd).reduce((s,x)=>s+Number(x.amount||0),0);
  const lwBudget = lwIncome - lwSavings;
  const lwSpent = DB.spending.filter(sp=>sp.date>=lwStart&&sp.date<=lwEnd).reduce((s,x)=>s+Number(x.amount||0),0);
  const lwOver = lwBudget>0 ? Math.max(0, lwSpent-lwBudget) : 0;
  budget = Math.max(0, budget - lwOver);
  const spent = DB.spending.filter(sp=>inRange(sp.date)).reduce((s,x)=>s+Number(x.amount||0),0);
  return {budget, spent, remaining: budget-spent, lwOver, income, savingsThisWeek};
}

/* ---------------- WEEKLY LIFE CHECK-IN ---------------- */
function weekRangeOffset(weeksAgo){
  const d = new Date();
  const day = d.getDay();
  const curStart = new Date(d); curStart.setDate(d.getDate()-day);
  const start = new Date(curStart); start.setDate(curStart.getDate() - 7*weeksAgo);
  const end = new Date(start); end.setDate(start.getDate()+6);
  const iso = x=> x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  return {start:iso(start), end:iso(end)};
}
function weeklyMoneyLine(range){
  if(!DB.spending.length && !DB.savings.length && !DB.income.length) return null;
  const inR = d=> d>=range.start && d<=range.end;
  const spent = DB.spending.filter(x=>inR(x.date)).reduce((s,x)=>s+Number(x.amount||0),0);
  const saved = DB.savings.filter(x=>inR(x.date)).reduce((s,x)=>s+Number(x.amount||0),0);
  const income = DB.income.filter(x=>inR(x.date)).reduce((s,x)=>s+Number(x.amount||0),0);
  const budget = Math.max(0, income-saved);
  let note = '';
  if(income>0) note = spent<=budget ? ' — within budget' : ' — over budget';
  if(spent===0 && saved===0 && income===0) return null;
  return `You spent $${spent.toFixed(0)}${saved>0?' and saved $'+saved.toFixed(0):''} this week${note}.`;
}
function generateWeeklyCheckin(weeksAgo){
  weeksAgo = weeksAgo || 1;
  const range = weekRangeOffset(weeksAgo);
  const prevRange = weekRangeOffset(weeksAgo+1);
  const inR = (arr,r)=> arr.filter(x=>x.date>=r.start && x.date<=r.end);

  const statsFor = (r)=>{
    const sleepItems = inR(DB.sleep,r).map(s=>sleepDurationHours(s.bed,s.wake)).filter(d=>d!==null);
    const cookingItems = inR(DB.cooking,r);
    const workItems = inR(DB.work,r);
    return {
      training: inR(DB.workouts,r).length,
      sleepNights: inR(DB.sleep,r).length,
      sleepAvg: sleepItems.length? +(sleepItems.reduce((a,b)=>a+b,0)/sleepItems.length).toFixed(1) : null,
      cooking: cookingItems.length,
      cookingAvg: cookingItems.length? +(cookingItems.reduce((s,c)=>s+Number(c.rating||0),0)/cookingItems.length).toFixed(1) : null,
      meals: inR(DB.meals,r).length,
      skincare: inR(DB.skincare,r).length,
      photos: inR(DB.photos,r).length,
      readingDays: new Set(inR(DB.reading,r).map(x=>x.date)).size,
      prayerDays: inR(DB.reading.filter(x=>x.prayed),r).length,
      workDays: workItems.length,
      leftBy7Pct: workItems.length? Math.round(workItems.filter(w=>w.leftBy7).length/workItems.length*100) : 0,
    };
  };
  const cur = statsFor(range);
  const prev = statsFor(prevRange);

  let doneSum=0, totalSum=0;
  for(let i=0;i<7;i++){
    const d = new Date(range.start+'T00:00:00'); d.setDate(d.getDate()+i);
    const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const dIdx = d.getDay();
    const isWeekday = dIdx>=1 && dIdx<=5;
    const items = [
      ...(DB.routine.morning||[]).map(x=>checklistKey('morning',x)),
      ...(isWeekday ? (DB.routine.workday||[]).map(x=>checklistKey('workday',x)) : []),
      ...((DB.routine.eveningByDay && DB.routine.eveningByDay[dIdx]) || []).map(x=>checklistKey('evening',x))
    ];
    const c = DB.checklist[iso]||{};
    totalSum += items.length;
    doneSum += items.filter(k=>c[k]).length;
  }
  const completionPct = totalSum? Math.round(doneSum/totalSum*100) : null;

  const categories = [
    {key:'training', label:'Training', icon:'💪', thisVal:cur.training, prevVal:prev.training, everUsed:DB.workouts.length>0, text:cur.training+' workout'+(cur.training===1?'':'s')},
    {key:'sleep', label:'Sleep', icon:'😴', thisVal:cur.sleepNights, prevVal:prev.sleepNights, everUsed:DB.sleep.length>0, text:cur.sleepAvg!==null? ('avg '+cur.sleepAvg+'h over '+cur.sleepNights+' night'+(cur.sleepNights===1?'':'s')) : 'not logged'},
    {key:'cooking', label:'Cooking', icon:'🍳', thisVal:cur.cooking, prevVal:prev.cooking, everUsed:DB.cooking.length>0, text:cur.cooking+' meal'+(cur.cooking===1?'':'s')+' cooked'+(cur.cookingAvg!==null?', avg '+cur.cookingAvg+'/10':'')},
    {key:'meals', label:'Meals', icon:'🍽️', thisVal:cur.meals, prevVal:prev.meals, everUsed:DB.meals.length>0, text:cur.meals+' meal'+(cur.meals===1?'':'s')+' logged'},
    {key:'skin', label:'Skincare', icon:'🧴', thisVal:cur.skincare, prevVal:prev.skincare, everUsed:DB.skincare.length>0, text:cur.skincare+' routine log'+(cur.skincare===1?'':'s')},
    {key:'photo', label:'Photography', icon:'📸', thisVal:cur.photos, prevVal:prev.photos, everUsed:DB.photos.length>0, text:cur.photos+'/7 days'},
    {key:'moral', label:'Moral', icon:'🙏', thisVal:cur.readingDays, prevVal:prev.readingDays, everUsed:DB.reading.length>0, text:cur.readingDays+' reading day'+(cur.readingDays===1?'':'s')+', '+cur.prayerDays+' prayer day'+(cur.prayerDays===1?'':'s')},
    {key:'work', label:'Work', icon:'💼', thisVal:cur.leftBy7Pct, prevVal:prev.leftBy7Pct, everUsed:DB.work.length>0, text:cur.workDays+' workday'+(cur.workDays===1?'':'s')+' logged'+(cur.workDays?', left by 7am '+cur.leftBy7Pct+'%':'')},
  ].filter(c=>c.everUsed);

  const wentWell = categories.filter(c=>c.thisVal>0 && c.thisVal>=c.prevVal).sort((a,b)=>b.thisVal-a.thisVal).slice(0,3)
    .map(c=>({label:c.label, icon:c.icon, text:c.text}));
  const improved = categories.filter(c=>c.thisVal>c.prevVal).sort((a,b)=>(b.thisVal-b.prevVal)-(a.thisVal-a.prevVal)).slice(0,3)
    .map(c=>({label:c.label, icon:c.icon, text:c.text}));
  const struggled = categories.filter(c=>c.thisVal===0 && c.prevVal>0).slice(0,3)
    .map(c=>({label:c.label, icon:c.icon, text:'No '+c.label.toLowerCase()+' logged this week (you usually do)'}));
  const lowestCat = [...categories].sort((a,b)=>a.thisVal-b.thisVal)[0];
  const focusNext = struggled.length ? {label:struggled[0].label, icon:struggled[0].icon} : (lowestCat ? {label:lowestCat.label, icon:lowestCat.icon} : null);

  const goalsCompletedList = DB.goals.filter(g=> g.completedAt && g.completedAt.slice(0,10)>=range.start && g.completedAt.slice(0,10)<=range.end).map(g=>g.name);
  const achievementsList = DB.achievements.filter(a=>a.date>=range.start && a.date<=range.end).map(a=>a.title);
  const moneyLine = weeklyMoneyLine(range);

  return {
    id: uid(),
    weekStart: range.start,
    weekEnd: range.end,
    generatedAt: new Date().toISOString(),
    completionPct,
    wentWell, improved, struggled, focusNext,
    moneyLine,
    goalsCompleted: goalsCompletedList,
    achievements: achievementsList,
  };
}

    if(withDur.length>=4){
      const med = [...withDur].sort((a,b)=>a.dur-b.dur)[Math.floor(withDur.length/2)].dur;
      const longer = withDur.filter(x=>x.dur>=med);

      if(longer.length && shorter.length){
        const avgLong = longer.reduce((s,x)=>s+x.energy,0)/longer.length;
        const avgShort = shorter.reduce((s,x)=>s+x.energy,0)/shorter.length;
        if(avgLong > avgShort+0.5) insight = `<div class="insight">🌱 You tend to report higher energy on mornings following longer sleep.</div>`;
      }
    }
  }
  return `

  `;
}
function sleepDurationHours(bed,wake){
  if(!bed || !wake) return null;
  const [bh,bm] = bed.split(':').map(Number);
  const [wh,wm] = wake.split(':').map(Number);
  let mins = (wh*60+wm) - (bh*60+bm);
  if(mins<0) mins += 24*60;
  return mins/60;
}

  if(!document.getElementById('sleepChart')) return;
  const entries = [...DB.sleep].sort((a,b)=>a.date.localeCompare(b.date)).slice(-14);

function shuffleWithSeed(arr, seed){
  const a = [...arr];

  for(let i=a.length-1;i>0;i--){ s = (s*9301+49297)%233280; const j = Math.floor((s/233280)*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ---------------- PERIOD detail (with cycle prediction) ---------------- */
function periodPrediction(){
  const dates = [...new Set(DB.period.map(p=>p.date))].sort();
  if(dates.length<2) return null;
  const gaps = [];
  for(let i=1;i<dates.length;i++){
    const d1 = new Date(dates[i-1]+'T00:00:00'), d2 = new Date(dates[i]+'T00:00:00');
    gaps.push(Math.round((d2-d1)/86400000));
  }
  const avg = gaps.reduce((s,g)=>s+g,0)/gaps.length;
  const variance = gaps.reduce((s,g)=>s+Math.pow(g-avg,2),0)/gaps.length;
  const stdDev = Math.sqrt(variance);
  const last = new Date(dates[dates.length-1]+'T00:00:00');
  const predicted = new Date(last); predicted.setDate(predicted.getDate()+Math.round(avg));
  const iso = predicted.getFullYear()+'-'+String(predicted.getMonth()+1).padStart(2,'0')+'-'+String(predicted.getDate()).padStart(2,'0');
  return { avgCycle: Math.round(avg), predicted: iso, irregular: stdDev > 4 };
}

  const pred = periodPrediction();
  return `
  ${pred ? `<div class="card">
    <div class="stat-row">
      <div class="stat"><div class="n">${pred.avgCycle}d</div><div class="l">Avg Cycle</div></div>

function groupPhotosByMonth(){
  const groups = {};
  DB.photos.forEach(p=>{
    const key = p.date.slice(0,7); // YYYY-MM
    if(!groups[key]) groups[key] = [];
    groups[key].push(p);
  });
  return Object.keys(groups).sort().reverse().map(key=>{
    const [y,m] = key.split('-');
    const label = new Date(Number(y), Number(m)-1, 1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
    const items = [...groups[key]].sort((a,b)=>b.date.localeCompare(a.date));
    const achievementsCount = DB.achievements.filter(a=>a.date.slice(0,7)===key).length;
    const goalsCount = DB.goals.filter(g=>g.completedAt && g.completedAt.slice(0,7)===key).length;
    const journalCount = items.filter(p=>p.caption && p.caption.trim()).length;
    return {key, label, items, achievementsCount, goalsCount, journalCount};
  });
}

function renderMoneyCharts(){
  if(!document.getElementById('savingsChart') && !document.getElementById('spendChart')) return;
  // savings over time (cumulative)
  if(document.getElementById('savingsChart')){
    const events = [...DB.savings.map(s=>({date:s.date, amt:Number(s.amount||0)}))].sort((a,b)=>a.date.localeCompare(b.date));
    let running=0; const labels=[]; const data=[];
    events.forEach(e=>{ running+=e.amt; labels.push(fmtDate(e.date)); data.push(running); });
    if(labels.length) renderChart('savingsChart','line',labels,[{label:'Total saved',data,borderColor:'#4F7A5B',backgroundColor:'rgba(79,122,91,0.12)',fill:true,tension:0.3}]);
  }
  if(document.getElementById('spendChart')){
    // last 6 weeks: total spend per week
    const weeks=[]; const now = new Date();
    for(let i=5;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-7*i - now.getDay()); const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); const start=iso(d); const end=new Date(d); end.setDate(end.getDate()+6); weeks.push({start, end:iso(end)}); }
    const labels = weeks.map(w=>fmtDate(w.start));
    const data = weeks.map(w=> DB.spending.filter(sp=>sp.date>=w.start && sp.date<=w.end).reduce((s,x)=>s+Number(x.amount||0),0));
    renderChart('spendChart','bar',labels,[{label:'Spent per week',data,backgroundColor:'#D98A6B'}]);
  }
  if(document.getElementById('categoryChart')){
    const totals={};
    DB.spending.forEach(sp=>{ const c=sp.category||'Other'; totals[c]=(totals[c]||0)+Number(sp.amount||0); });
    const labels = Object.keys(totals);
    const data = Object.values(totals);
    if(labels.length) renderChart('categoryChart','doughnut',labels,[{data,backgroundColor:['#4F7A5B','#D98A6B','#3E6C8E','#B6607D','#B8912B','#7C6F9E','#4C8177']}]);
  }
}

function showExerciseHint(i){
  const nameEl = document.getElementById('f_ex'+i+'_name');
  const hintEl = document.getElementById('f_ex'+i+'_hint');
  if(!nameEl || !hintEl) return;
  const name = nameEl.value.trim().toLowerCase();
  if(!name){ hintEl.textContent=''; return; }
  let last=null, pr=null;
  DB.workouts.forEach(w=>{
    (w.exercises||[]).forEach(ex=>{
      if((ex.name||'').trim().toLowerCase()===name){
        if(!last || w.date>last.date) last = {date:w.date, weight:ex.weight, reps:ex.reps};
        if(ex.weight!==undefined && ex.weight!==null && ex.weight!=='' && (pr===null || Number(ex.weight)>Number(pr))) pr = ex.weight;
      }
    });
  });
  hintEl.textContent = last ? ('Last time: '+(last.weight||'-')+'kg × '+(last.reps||'-')+(pr!==null?' · PR: '+pr+'kg':'')) : 'No history yet for this exercise.';
}
function showCookingHint(){
  const nameEl = document.getElementById('f_recipe');
  const hintEl = document.getElementById('recipeHint');
  if(!nameEl || !hintEl) return;
  const name = nameEl.value.trim().toLowerCase();
  if(!name){ hintEl.innerHTML=''; return; }
  const attempts = DB.cooking.filter(c=>(c.recipe||'').trim().toLowerCase()===name).sort((a,b)=>b.date.localeCompare(a.date));
  if(!attempts.length){ hintEl.innerHTML=''; return; }
  const last = attempts[0];
  const avg = (attempts.reduce((s,a)=>s+Number(a.rating||0),0)/attempts.length).toFixed(1);
  hintEl.innerHTML = `<div class="insight">🍝 You've cooked this ${attempts.length}× (avg ${avg}/10). ${last.worked?'✅ '+esc(last.worked)+'. ':''}${last.notes?'💡 '+esc(last.notes):''}</div>`;
}
async function handlePhotoFileChange(input){
  const file = input.files && input.files[0];
  const preview = document.getElementById('photoPreview');
  const saveBtn = document.querySelector('[data-save]');
  if(!file) return;
  qaTemp.photoProcessing = true;
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Processing photo...'; }
  if(preview) preview.innerHTML = `<div class="sub">Processing photo...</div>`;
  try{
    const dataUrl = await compressImageFile(file, 640);
    qaTemp.photoData = dataUrl;
    if(preview) preview.innerHTML = `<img src="${dataUrl}" style="width:100%;border-radius:12px;">`;
  }catch(e){
    if(preview) preview.innerHTML = `<div class="sub" style="color:#B6607D;">Could not process that photo: ${esc(humanizeError(e))}</div>`;
  }finally{
    qaTemp.photoProcessing = false;
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'Save'; }
  }
}
function sliderField(id,label,initial){
  const v = initial!==undefined && initial!==null && initial!=='' ? initial : 5;
  return `<div class="form-field"><label>${label}</label><div class="slider-row"><input type="range" min="1" max="10" value="${v}" id="${id}" oninput="document.getElementById('${id}_v').textContent=this.value"><div class="slider-val" id="${id}_v">${v}</div></div></div>`;
}

/* ---------------- Save handlers per quick action ----------------
   IMPORTANT: every branch below builds the entry, applies it to a COPY of the
   array, and only commits it to DB once `await save(dbKey)` has actually
   resolved. If the underlying storage write fails, we roll back to the
   original array and show the real error message in the form instead of
   pretending the entry was saved (this is what was silently broken before —
   save() was fire-and-forget, so a failed write still looked successful in
   the UI until the app was reloaded and the entry had vanished). */
let qaTemp = {}; // holds chip selections
function humanizeError(e){
  if(!e) return 'Unknown error.';
  let msg = e.message || String(e);
  if(e.name && e.name!=='Error' && !msg.includes(e.name)) msg = e.name+': '+msg;
  return msg;
}
async function saveQA(type, editId){
  if((type==='photo'||type==='fitnessphoto'||type==='skinphoto') && qaTemp.photoProcessing){
    return; // photo still compressing — button should be disabled, but guard anyway
  }
  const iso = todayISO();
  const val = id=> (document.getElementById(id)||{}).value;
  let dbKey, entry;

  if(type==='spending'){
    dbKey='spending';
    entry = {id: editId||uid(), date:iso, amount:Number(val('f_amount')||0), what:val('f_what'), category:val('f_category')};
  } else if(type==='income'){
    dbKey='income';
    entry = {id: editId||uid(), date:iso, amount:Number(val('f_amount')||0)};
  } else if(type==='addsavings'){
    dbKey='savings';
    entry = {id: editId||uid(), date:iso, amount:Number(val('f_amount')||0)};
  } else if(type==='meal'){
    dbKey='meals';
    entry = {id: editId||uid(), date:iso, slot:qaTemp.slot||'meal', what:val('f_what'), feeling:val('f_feeling'), dairyFree: !!(document.getElementById('f_df')||{}).checked};
  } else if(type==='workout'){
    dbKey='workouts';
    const exercises = [1,2,3].map(i=>{
      const name = val('f_ex'+i+'_name');
      if(!name || !name.trim()) return null;
      return { name: name.trim(), weight: val('f_ex'+i+'_weight'), sets: val('f_ex'+i+'_sets'), reps: val('f_ex'+i+'_reps') };
    }).filter(Boolean);
    entry = {id: editId||uid(), date:iso, type:qaTemp.wtype||'Workout', exercises, notes:val('f_notes')};
  } else if(type==='bodymeasurement'){
    dbKey='bodyMeasurements';
    entry = {id: editId||uid(), date:iso, weight:val('f_weight'), waist:val('f_waist'), hips:val('f_hips'), chest:val('f_chest'), arms:val('f_arms'), thighs:val('f_thighs')};
  } else if(type==='fitnessphoto'){
    dbKey='fitnessPhotos';
    if(!qaTemp.photoData){ closeModal(); render(); return; }
    entry = {id: editId||uid(), date:iso, photoData:qaTemp.photoData};
  } else if(type==='skinphoto'){
    dbKey='skinPhotos';
    if(!qaTemp.photoData){ closeModal(); render(); return; }
    entry = {id: editId||uid(), date:iso, photoData:qaTemp.photoData};
  } else if(type==='sleep'){
    dbKey='sleep';
    entry = {id: editId||uid(), date:iso, bed:val('f_bed'), wake:val('f_wake'), quality:val('f_quality'), energy:val('f_energy'), mood:val('f_mood'), notes:val('f_notes')};
  } else if(type==='reading'){
    dbKey='reading';
    const rDate = val('f_date') || iso;
    entry = {id: editId||uid(), date:rDate, passage:val('f_passage'), impression:val('f_impression'), prayed: !!(document.getElementById('f_prayed')||{}).checked};
  } else if(type==='cooking'){
    dbKey='cooking';
    entry = {id: editId||uid(), date:iso, recipe:val('f_recipe'), rating:Number(val('f_rating')||0), worked:val('f_worked'), notes:val('f_notes')};
  } else if(type==='photo'){
    dbKey='photos';
    const existingToday = DB.photos.find(p=>p.date===iso);
    entry = {id: editId||uid(), date:iso, caption:val('f_caption'), photoData: qaTemp.photoData || (existingToday?existingToday.photoData:null)};
  } else if(type==='skincare'){
    dbKey='skincare';
    const checked = [...document.querySelectorAll('.skinProductCheck:checked')].map(el=>el.dataset.product);
    entry = {id: editId||uid(), date:iso, period:qaTemp.period||'am', products:checked, redness:Number(val('f_redness')||0), breakouts:Number(val('f_breakouts')||0), dryness:Number(val('f_dryness')||0), notes:val('f_notes')};
  } else if(type==='period'){
    dbKey='period';
    const pDate = val('f_date') || iso;
    entry = {id: editId||uid(), date:pDate, flow:qaTemp.flow||'', pain:Number(val('f_pain')||0), mood:Number(val('f_mood')||0), notes:val('f_notes')};
  } else if(type==='work'){
    dbKey='work';
    entry = {id: editId||uid(), date:iso, leftHome:val('f_leftHome'), leftBy7: !!(document.getElementById('f_leftBy7')||{}).checked, arrived:val('f_arrived'), left:val('f_left'), accomplished:val('f_accomplished'), notes:val('f_notes')};
  } else if(type==='proud'){
    dbKey='proudMoments';
    entry = {id: editId||uid(), date:iso, text:val('f_text')};
  } else if(type==='weeklyreflection'){

  } else {
    closeModal(); render(); return;
  }

  const original = DB[dbKey];
  const updated = [...original];
  if(type==='photo'){
    // only one official Photo of the Day per date
    const withoutToday = updated.filter(p=> p.date!==entry.date || p.id===editId);
    const idx = withoutToday.findIndex(p=>p.id===entry.id);
    if(idx>-1) withoutToday[idx]=entry; else withoutToday.push(entry);
    DB[dbKey] = withoutToday;
  } else if(editId){
    const idx = updated.findIndex(x=>x.id===editId);
    if(idx>-1) updated[idx]=entry; else updated.push(entry);
    DB[dbKey] = updated;
  } else {
    updated.push(entry);
    DB[dbKey] = updated;
  }

  try{
    await save(dbKey); // throws if the write genuinely failed — nothing below runs until this succeeds

    let celebrated = false;
    if(type==='spending') autoCheckMatching(['spending']);
    else if(type==='meal'){ autoCheckMatching(['meal','breakfast','lunch','dinner','tea','snack']); celebrated = checkGoalCompletion(); }
    else if(type==='workout'){ autoCheckMatching(['workout','gym','walk']); celebrated = checkGoalCompletion(); }
    else if(type==='sleep') autoCheckMatching(['sleep']);
    else if(type==='reading'){ autoCheckMatching(['reading','pray']); celebrated = checkGoalCompletion(); }
    else if(type==='cooking'){ autoCheckMatching(['cook']); celebrated = checkGoalCompletion(); }
    else if(type==='photo'){ autoCheckMatching(['photo']); celebrated = checkGoalCompletion(); }
    else if(type==='skincare') autoCheckMatching(['skincare','skin'], [entry.period==='pm' ? 'evening' : 'morning']);
    else if(type==='period') autoCheckMatching(['period']);
    else if(type==='work') autoCheckMatching(['work']);
    checkAllAchievements();

    qaTemp = {};
    if(!celebrated) closeModal();
    render();
    if(!celebrated) showToast('🌿 Saved');
  }catch(e){
    // Do NOT roll back and discard what was typed — that's a second, worse bug than the save
    // failing in the first place. Keep the entry, flag it as unsynced, let the person retry.
    entry._pending = true;
    entry._error = humanizeError(e);
    qaTemp = {};
    closeModal();
    render();
    showToast('Saved on this device — will sync when possible');
  }
}

function checkAllAchievements(){
  // TRAINING
  if(DB.workouts.length===1) addAchievement('training-first-workout', '💪 First Workout Logged', {section:'Training', icon:'💪'});

  const exercisePRs = {};
  DB.workouts.forEach(w=>(w.exercises||[]).forEach(ex=>{
    if(!ex.name || ex.weight===undefined || ex.weight==='') return;
    const key = ex.name.trim().toLowerCase();
    const v = Number(ex.weight);
    if(isNaN(v)) return;
    if(!exercisePRs[key] || v>exercisePRs[key].pr) exercisePRs[key] = {pr:v, name:ex.name.trim()};
  }));
  [50,100,150,200,250,300].forEach(t=>{
    Object.values(exercisePRs).forEach(({pr,name})=>{
      if(pr>=t) addAchievement('training-pr-'+name.toLowerCase()+'-'+t, '💪 '+name+' — '+t+'kg milestone', {section:'Training', icon:'💪', description:'Reached '+t+'kg on '+name+'.'});
    });
  });

  // SAVINGS
  const totalSaved = DB.savings.reduce((s,x)=>s+Number(x.amount||0),0);
  [1000,5000,10000,25000,50000,100000].forEach(t=>{
    if(totalSaved>=t) addAchievement('savings-milestone-'+t, '💰 $'+t.toLocaleString()+' Saved', {section:'Savings', icon:'💰', description:'Total savings passed $'+t.toLocaleString()+'.'});
  });
  let weeksStreak=0;
  for(let i=0;i<12;i++){
    const r = weekRangeOffset(i);
    const inc = DB.income.filter(x=>x.date>=r.start&&x.date<=r.end).reduce((s,x)=>s+Number(x.amount||0),0);
    const sav = DB.savings.filter(x=>x.date>=r.start&&x.date<=r.end).reduce((s,x)=>s+Number(x.amount||0),0);
    const spent = DB.spending.filter(x=>x.date>=r.start&&x.date<=r.end).reduce((s,x)=>s+Number(x.amount||0),0);
    if(inc>0 && spent<=Math.max(0,inc-sav)) weeksStreak++; else break;
  }
  if(weeksStreak>=4) addAchievement('savings-budget-streak-4', '💰 4-Week Budget Streak', {section:'Savings', icon:'💰'});
  if(weeksStreak>=8) addAchievement('savings-budget-streak-8', '💰 8-Week Budget Streak', {section:'Savings', icon:'💰'});

  // COOKING
  if(DB.cooking.length===1) addAchievement('cooking-first', '🍳 First Recipe Cooked', {section:'Cooking', icon:'🍳'});
  recipeGroups().forEach(g=>{
    if(g.count>=5) addAchievement('cooking-5x-'+g.name.toLowerCase(), '🍳 '+g.name+' Cooked 5 Times', {section:'Cooking', icon:'🍳'});
    if(g.stage==='Mastered') addAchievement('cooking-mastered-'+g.name.toLowerCase(), '🍳 '+g.name+' Mastered', {section:'Cooking', icon:'🍳'});
  });
  if(DB.cooking.length>=10){
    const sorted = [...DB.cooking].sort((a,b)=>a.date.localeCompare(b.date));
    const firstAvg = sorted.slice(0,5).reduce((s,c)=>s+Number(c.rating||0),0)/5;
    const lastAvg = sorted.slice(-5).reduce((s,c)=>s+Number(c.rating||0),0)/5;
    if(lastAvg-firstAvg>=1.5) addAchievement('cooking-improved', '🍳 Cooking Has Improved', {section:'Cooking', icon:'🍳', description:'Average rating climbed from '+firstAvg.toFixed(1)+' to '+lastAvg.toFixed(1)+'.'});
  }

  // MORAL
  const readingStreak = currentStreak(DB.reading.map(r=>r.date));
  if(readingStreak>=7) addAchievement('moral-reading-streak-7', '🙏 7-Day Reading Streak', {section:'Moral', icon:'🙏'});
  if(readingStreak>=30) addAchievement('moral-reading-streak-30', '🙏 30-Day Reading Streak', {section:'Moral', icon:'🙏'});
  const prayerStreak = currentStreak(DB.reading.filter(r=>r.prayed).map(r=>r.date));
  if(prayerStreak>=7) addAchievement('moral-prayer-streak-7', '🙏 7-Day Prayer Streak', {section:'Moral', icon:'🙏'});
  if(prayerStreak>=30) addAchievement('moral-prayer-streak-30', '🙏 30-Day Prayer Streak', {section:'Moral', icon:'🙏'});
  const totalReadingDays = new Set(DB.reading.map(r=>r.date)).size;
  [10,30,60,100,180,365].forEach(t=>{
    if(totalReadingDays>=t) addAchievement('moral-reading-milestone-'+t, '🙏 '+t+' Reading Days', {section:'Moral', icon:'🙏'});
  });

  // PHOTOGRAPHY
  const photoStreak = currentStreak(DB.photos.map(p=>p.date));
  if(photoStreak>=7) addAchievement('photo-streak-7', '📸 7-Day Photo Streak', {section:'Photography', icon:'📸'});
  if(photoStreak>=30) addAchievement('photo-streak-30', '📸 30-Day Photo Streak', {section:'Photography', icon:'📸'});
  [10,50,100,365].forEach(t=>{
    if(DB.photos.length>=t) addAchievement('photo-milestone-'+t, '📸 '+t+' Photos Taken', {section:'Photography', icon:'📸'});
  });

  // OVERALL
  const anyActivityDates = new Set([
    ...DB.workouts.map(w=>w.date), ...DB.meals.map(m=>m.date), ...DB.cooking.map(c=>c.date),
    ...DB.reading.map(r=>r.date), ...DB.photos.map(p=>p.date), ...DB.skincare.map(s=>s.date),
    ...DB.sleep.map(s=>s.date), ...DB.spending.map(s=>s.date), ...DB.work.map(w=>w.date), ...DB.period.map(p=>p.date)
  ]);
  const overallStreak = currentStreak([...anyActivityDates]);
  if(overallStreak>=7) addAchievement('overall-streak-7', '🌱 7-Day Consistency', {section:'Overall', icon:'🌱'});
  if(overallStreak>=30) addAchievement('overall-streak-30', '🌱 30-Day Consistency', {section:'Overall', icon:'🌱'});
}

/* ---------------- retry machinery for entries that failed to sync ---------------- */
const PENDING_LIST_KEYS = ['spending','meals','workouts','sleep','reading','cooking','photos','skincare','period'];
function pendingItems(){
  const out=[];
  PENDING_LIST_KEYS.forEach(k=> (DB[k]||[]).forEach(it=>{ if(it._pending) out.push({dbKey:k, id:it.id, error:it._error}); }));
  return out;
}
async function retryPendingForKey(dbKey){
  try{
    await save(dbKey);
    (DB[dbKey]||[]).forEach(it=>{ delete it._pending; delete it._error; });
  }catch(e){
    (DB[dbKey]||[]).forEach(it=>{ if(it._pending) it._error = humanizeError(e); });
  }
  render();
}
async function retryAllPending(){
  const keys = [...new Set(pendingItems().map(p=>p.dbKey))];
  for(const k of keys) await retryPendingForKey(k);
}

/* ---------------- delete helper ---------------- */
function deleteEntry(spec){
  const [dbKey,id] = spec.split(':');
  DB[dbKey] = DB[dbKey].filter(x=>x.id!==id);
  save(dbKey);
  render();
}

/* ---------------- PROGRESS CENTER ---------------- */
let progressCategory = 'training';
let progressRange = 'month';
function rangeCutoffISO(range){
  const d = new Date();
  if(range==='week') d.setDate(d.getDate()-7);
  else if(range==='month') d.setMonth(d.getMonth()-1);
  else if(range==='3months') d.setMonth(d.getMonth()-3);
  else if(range==='6months') d.setMonth(d.getMonth()-6);
  else if(range==='year') d.setFullYear(d.getFullYear()-1);
  else return null;
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function statRow(pairs){
  return `<div class="stat-row">${pairs.map(([l,n])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('')}</div>`;
}
function renderProgressPage(){
  const cats = [
    {k:'training',l:'Fitness',e:'💪'},{k:'sleep',l:'Sleep',e:'😴'},{k:'cooking',l:'Cooking',e:'🍳'},
    {k:'meals',l:'Meals',e:'🍽️'},{k:'money',l:'Money',e:'💰'},{k:'period',l:'Period',e:'🌸'},
    {k:'skin',l:'Skin',e:'🧴'},{k:'photo',l:'Photography',e:'📸'},{k:'moral',l:'Moral',e:'🙏'},{k:'work',l:'Work',e:'💼'}
  ];
  const ranges = [{k:'week',l:'Week'},{k:'month',l:'Month'},{k:'3months',l:'3 Months'},{k:'year',l:'Year'},{k:'all',l:'All Time'}];
  const comparisons = buildComparisons();
  return `
  <div class="nav-header"><button class="back-btn" data-back-more>←</button><h2>📊 Progress</h2></div>
  <div class="screen">
    ${comparisons.length?`<div class="section-title" style="margin-top:0;">Better Than Last Month <div class="rule"></div></div>
    <div class="card">${comparisons.map(c=>`
      <div class="entry-item"><div><div class="main">${c.icon} ${esc(c.label)}</div></div><div style="font-weight:700;color:${c.positive?'var(--dash)':'#B6607D'};">${esc(c.text)}</div></div>`).join('')}</div>`:''}
    <div class="chip-row" style="margin-bottom:10px;">${cats.map(c=>`<button type="button" class="chip ${progressCategory===c.k?'active':''}" data-progress-cat="${c.k}">${c.e} ${c.l}</button>`).join('')}</div>
    <div class="chip-row" style="margin-bottom:14px;">${ranges.map(r=>`<button type="button" class="chip ${progressRange===r.k?'active':''}" data-progress-range="${r.k}">${r.l}</button>`).join('')}</div>
    <div class="card" id="progressStats"></div>
    <div class="card">${chartCanvas('progressChart',200)}</div>
  </div>`;
}
function renderProgressCharts(){
  if(!document.getElementById('progressChart')) return;
  const cutoff = rangeCutoffISO(progressRange);
  const inRange = arr => cutoff ? arr.filter(x=>x.date>=cutoff) : arr;
  const statsEl = document.getElementById('progressStats');
  let labels=[], datasets=[], type='bar', statsHtml='';
  if(progressCategory==='training'){
    const items = inRange(DB.workouts);
    const byDate = {}; items.forEach(w=>byDate[w.date]=(byDate[w.date]||0)+1);
    labels = Object.keys(byDate).sort(); datasets=[{label:'Workouts',data:labels.map(l=>byDate[l]),backgroundColor:'#3E6C8E'}];
    labels = labels.map(fmtDate);
    statsHtml = statRow([['Total workouts',items.length]]);
  } else if(progressCategory==='sleep'){
    const items = inRange(DB.sleep).sort((a,b)=>a.date.localeCompare(b.date));
    labels = items.map(e=>fmtDate(e.date)); type='line';
    datasets=[{label:'Quality',data:items.map(e=>Number(e.quality||0)),borderColor:'#7C6F9E'},{label:'Energy',data:items.map(e=>Number(e.energy||0)),borderColor:'#B8912B'}];
    const avgQ = items.length? (items.reduce((s,x)=>s+Number(x.quality||0),0)/items.length).toFixed(1):'-';
    statsHtml = statRow([['Nights logged',items.length],['Avg quality',avgQ]]);
  } else if(progressCategory==='cooking'){
    const items = inRange(DB.cooking).sort((a,b)=>a.date.localeCompare(b.date));
    labels = items.map(e=>fmtDate(e.date)); type='line';
    datasets=[{label:'Rating',data:items.map(e=>Number(e.rating||0)),borderColor:'#C1743B'}];
    statsHtml = statRow([['Recipes cooked',items.length],['Unique recipes',new Set(items.map(i=>i.recipe)).size]]);
  } else if(progressCategory==='meals'){
    const items = inRange(DB.meals);
    const dfPct = items.length? Math.round(items.filter(m=>m.dairyFree).length/items.length*100):0;
    const byDate={}; items.forEach(m=>byDate[m.date]=(byDate[m.date]||0)+1);
    labels=Object.keys(byDate).sort().map(fmtDate); datasets=[{label:'Meals logged',data:Object.keys(byDate).sort().map(l=>byDate[l]),backgroundColor:'#D98A6B'}];
    statsHtml = statRow([['Meals logged',items.length],['Dairy-free',dfPct+'%']]);
  } else if(progressCategory==='money'){
    const items = inRange(DB.spending).sort((a,b)=>a.date.localeCompare(b.date));
    const byDate={}; items.forEach(s=>byDate[s.date]=(byDate[s.date]||0)+Number(s.amount||0));
    labels=Object.keys(byDate).sort().map(fmtDate); datasets=[{label:'Spending',data:Object.keys(byDate).sort().map(l=>byDate[l]),backgroundColor:'#4F7A5B'}];
    statsHtml = statRow([['Total spent','$'+items.reduce((s,x)=>s+Number(x.amount||0),0).toFixed(0)],['Total saved','$'+DB.savings.reduce((s,x)=>s+Number(x.amount||0),0).toFixed(0)]]);
  } else if(progressCategory==='period'){
    const items = inRange(DB.period);
    statsHtml = statRow([['Entries logged',items.length]]);
  } else if(progressCategory==='skin'){
    const items = inRange(DB.skincare);
    const byDate={}; items.forEach(s=>byDate[s.date]=(byDate[s.date]||0)+1);
    labels=Object.keys(byDate).sort().map(fmtDate); datasets=[{label:'Routine logs',data:Object.keys(byDate).sort().map(l=>byDate[l]),backgroundColor:'#C97E92'}];
    statsHtml = statRow([['Routine logs',items.length],['Progress photos',DB.skinPhotos.length]]);
  } else if(progressCategory==='photo'){
    const items = inRange(DB.photos);
    const byDate={}; items.forEach(p=>byDate[p.date]=1);
    labels=Object.keys(byDate).sort().map(fmtDate); datasets=[{label:'Photos',data:Object.keys(byDate).sort().map(()=>1),backgroundColor:'#B8912B'}];
    statsHtml = statRow([['Photos logged',items.length],['Current streak',currentStreak(DB.photos.map(p=>p.date))+' days']]);
  } else if(progressCategory==='moral'){
    const items = inRange(DB.reading);
    const byDate={}; items.forEach(r=>byDate[r.date]=1);
    labels=Object.keys(byDate).sort().map(fmtDate); datasets=[{label:'Reading days',data:Object.keys(byDate).sort().map(()=>1),backgroundColor:'#4C8177'}];
    statsHtml = statRow([['Reading days',items.length],['Prayer days',items.filter(r=>r.prayed).length],['Streak',currentStreak(DB.reading.map(r=>r.date))+' days']]);
  } else if(progressCategory==='work'){
    const items = inRange(DB.work);
    const leftBy7 = items.filter(w=>w.leftBy7).length;
    statsHtml = statRow([['Days logged',items.length],['Left by 7am',items.length?Math.round(leftBy7/items.length*100)+'%':'-']]);
  }
  if(labels.length && datasets.length) renderChart('progressChart', type, labels, datasets);
  else if(chartInstances['progressChart']){ chartInstances['progressChart'].destroy(); delete chartInstances['progressChart']; }
  if(statsEl) statsEl.innerHTML = statsHtml || '<div class="sub">Not enough data yet for this range.</div>';
}

/* ---------------- MY LIFE SO FAR ---------------- */
let myYearRange = 'year';
/* ---------------- MY LIFE SO FAR: Then -> Now ---------------- */
function buildThenNow(){
  const items = [];
  const exerciseHistory = {};
  DB.workouts.forEach(w=>(w.exercises||[]).forEach(ex=>{
    if(!ex.name || ex.weight===undefined || ex.weight==='') return;
    const k = ex.name.trim().toLowerCase();
    const v = Number(ex.weight);
    if(isNaN(v)) return;
    if(!exerciseHistory[k]) exerciseHistory[k] = {name:ex.name.trim(), entries:[]};
    exerciseHistory[k].entries.push({date:w.date, v});
  }));
  let bestExercise = null;
  Object.values(exerciseHistory).forEach(e=>{
    if(e.entries.length>=2 && (!bestExercise || e.entries.length>bestExercise.entries.length)) bestExercise = e;
  });
  if(bestExercise){
    const sorted = [...bestExercise.entries].sort((a,b)=>a.date.localeCompare(b.date));
    const then = sorted[0].v;
    const now = Math.max(...sorted.map(x=>x.v));
    if(now>then) items.push({icon:'\ud83d\udcaa', label:bestExercise.name, then:then+'kg', now:now+'kg', color:'var(--training)'});
  }
  if(DB.cooking.length>=6){
    const sorted = [...DB.cooking].sort((a,b)=>a.date.localeCompare(b.date));
    const firstAvg = sorted.slice(0,5).reduce((s,c)=>s+Number(c.rating||0),0)/5;
    const lastAvg = sorted.slice(-5).reduce((s,c)=>s+Number(c.rating||0),0)/5;
    if(lastAvg>firstAvg) items.push({icon:'\ud83c\udf73', label:'Cooking average rating', then:firstAvg.toFixed(1), now:lastAvg.toFixed(1), color:'var(--cooking)'});
  }
  if(DB.savings.length>=2){
    const sorted = [...DB.savings].sort((a,b)=>a.date.localeCompare(b.date));
    const then = Number(sorted[0].amount||0);
    const now = DB.savings.reduce((s,x)=>s+Number(x.amount||0),0);
    if(now>then) items.push({icon:'\ud83d\udcb0', label:'Savings', then:'$'+then.toFixed(0), now:'$'+now.toFixed(0), color:'var(--savings)'});
  }
  const allDates = Object.keys(DB.checklist).sort();
  if(allDates.length>=10){
    const pctForDates = (dates)=>{
      let done=0,total=0;
      dates.forEach(iso=>{
        const dIdx = new Date(iso+'T00:00:00').getDay();
        const isWeekday = dIdx>=1&&dIdx<=5;
        const its = [
          ...(DB.routine.morning||[]).map(x=>checklistKey('morning',x)),
          ...(isWeekday?(DB.routine.workday||[]).map(x=>checklistKey('workday',x)):[]),
          ...((DB.routine.eveningByDay&&DB.routine.eveningByDay[dIdx])||[]).map(x=>checklistKey('evening',x))
        ];
        const c = DB.checklist[iso]||{};
        total+=its.length; done+=its.filter(k=>c[k]).length;
      });
      return total? Math.round(done/total*100):null;
    };
    const thenPct = pctForDates(allDates.slice(0,7));
    const nowPct = pctForDates(allDates.slice(-7));
    if(thenPct!==null && nowPct!==null && nowPct>thenPct) items.push({icon:'\ud83c\udf31', label:'Daily consistency', then:thenPct+'%', now:nowPct+'%', color:'var(--dash)'});
  }
  if(DB.reading.length>=6){
    const dates = [...new Set(DB.reading.map(r=>r.date))].sort();
    const then = currentStreakAsOf(DB.reading.map(r=>r.date), dates[6]);
    const now = currentStreak(DB.reading.map(r=>r.date));
    if(now>then) items.push({icon:'\ud83d\ude4f', label:'Reading streak', then:then+' days', now:now+' days', color:'var(--moral)'});
  }
  return items.slice(0,5);
}
function currentStreakAsOf(dates, asOfISO){
  const set = new Set(dates);
  let n=0; let d=new Date(asOfISO+'T00:00:00');
  while(true){
    const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(set.has(iso)){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}
