const BACKUP_FORMAT = 'my-garden-backup';
const BACKUP_VERSION = 1;

/* Collects every piece of app data for a backup. Starts from the in-memory DB (the live,
   authoritative state) but also scans localStorage directly for any "db:" keys that aren't
   in the current KEYS list — a safety net so a future update that adds a new section without
   remembering to touch this function still can't silently lose data out of a backup. */
function collectAllBackupData(){
  const data = {};
  KEYS.forEach(k=>{ data[k] = DB[k]; });
  if(localStorageOK){
    try{
      for(let i=0;i<localStorage.length;i++){
        const rawKey = localStorage.key(i);
        if(rawKey && rawKey.indexOf('db:')===0){
          const shortKey = rawKey.slice(3);
          if(!(shortKey in data)){
            try{ data[shortKey] = JSON.parse(localStorage.getItem(rawKey)); }
            catch(e){ data[shortKey] = localStorage.getItem(rawKey); }
          }
        }
      }
    }catch(e){}
  }
  return data;
}
function buildBackupPayload(){
  return {
    _backupFormat: BACKUP_FORMAT,
    _backupVersion: BACKUP_VERSION,
    _exportedAt: new Date().toISOString(),
    data: collectAllBackupData()
  };
}
function fmtFullDate(isoDateTime){
  try{ return new Date(isoDateTime).toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'}); }
  catch(e){ return isoDateTime; }
}
function hasAnyData(){
  return KEYS.some(k=> Array.isArray(DB[k]) && DB[k].length>0);
}
function daysSinceLastBackup(){
  if(!DB.settings.lastBackupAt) return null;
  const last = new Date(DB.settings.lastBackupAt);
  if(isNaN(last.getTime())) return null;
  return Math.floor((Date.now()-last.getTime())/86400000);
}
function nextReminderText(){
  const days = daysSinceLastBackup();
  if(days===null) return hasAnyData() ? 'now' : '—';
  if(days>=7) return 'now';
  const remaining = 7-days;
  return 'in '+remaining+' day'+(remaining===1?'':'s');
}
function renderBackupReminder(){
  if(backupReminderDismissed) return '';
  const days = daysSinceLastBackup();
  const overdue = days===null ? hasAnyData() : days>=7;
  if(!overdue) return '';
  const prominent = days!==null && days>=14;
  const sinceText = days===null ? "you've never exported one" : `it's been ${days} day${days===1?'':'s'} since your last backup`;
  return `<div class="insight" style="background:${prominent?'#F6E4EA':'var(--dash-bg)'};color:${prominent?'#B6607D':'var(--dash)'};">
    <span class="ic">🌱</span><span>Your garden needs a little backup — ${sinceText}.
    <button data-export-quick style="border:none;background:none;color:inherit;text-decoration:underline;font-weight:700;padding:0;">Export Backup</button>
    <button data-dismiss-backup-reminder style="border:none;background:none;color:inherit;opacity:0.65;padding:0 0 0 10px;">Dismiss</button></span>
  </div>`;
}

/* type: 'manual' (person tapped Export Backup — updates the Last Backup date and closes
   the reminder) or 'safety' (automatic snapshot taken right before a restore — does NOT
   count as a "real" backup for reminder purposes, since it's a byproduct, not a deliberate one). */
function doExport(kind){
  kind = kind || 'manual';
  const payload = buildBackupPayload();
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const prefix = kind==='safety' ? 'my-garden-safety-before-restore-' : 'my-garden-backup-';
  a.href = url; a.download = prefix+todayISO()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  if(kind==='manual'){
    DB.settings.lastBackupAt = new Date().toISOString();
    save('settings');
  }
}

function showImportMsg(text, isError){
  const el = document.getElementById('importMsg');
  if(!el) return;
  el.style.display = 'block';
  el.style.background = isError ? '#F6E4EA' : 'var(--dash-bg)';
  el.style.color = isError ? '#B6607D' : 'var(--dash)';
  el.textContent = text;
}

/* Accepts either the new versioned format ({_backupFormat, _backupVersion, data}) or a
   legacy flat export from before this upgrade (a plain object with app keys at the top
   level) — old backups people already made must keep working. */
function validateBackupFile(parsed){
  if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed)){
    return {valid:false, error:'This file is not a valid backup (not a JSON object).'};
  }
  let data;
  if(parsed._backupFormat === BACKUP_FORMAT){
    if(typeof parsed._backupVersion !== 'number'){
      return {valid:false, error:'This backup is missing a version number and cannot be safely restored.'};
    }
    if(parsed._backupVersion > BACKUP_VERSION){
      return {valid:false, error:'This backup was made with a newer version of the app than this one supports.'};
    }
    if(!parsed.data || typeof parsed.data !== 'object' || Array.isArray(parsed.data)){
      return {valid:false, error:'This backup file is missing its data.'};
    }
    data = parsed.data;
  } else {
    const looksLegacy = KEYS.some(k=> k in parsed);
    if(!looksLegacy) return {valid:false, error:"This doesn't look like a My Garden backup file."};
    data = parsed;
  }
  if(data.settings !== undefined && (typeof data.settings !== 'object' || Array.isArray(data.settings))){
    return {valid:false, error:'This backup file appears to be corrupted (settings section is invalid).'};
  }
  if(data.routine !== undefined && (typeof data.routine !== 'object' || Array.isArray(data.routine))){
    return {valid:false, error:'This backup file appears to be corrupted (routine section is invalid).'};
  }
  if(Object.keys(data).length === 0){
    return {valid:false, error:'This backup file has no data in it.'};
  }
  return {valid:true, data};
}

let pendingRestoreData = null;
async function handleRestoreFileChange(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    let parsed;
    try{ parsed = JSON.parse(text); }
    catch(err){ showImportMsg("Could not read that file — it doesn't look like valid JSON. Your existing data has not been changed.", true); e.target.value=''; return; }
    const result = validateBackupFile(parsed);
    if(!result.valid){
      showImportMsg('⚠️ '+result.error+' Your existing data has not been changed.', true);
      e.target.value='';
      return;
    }
    pendingRestoreData = result.data;
    openModal({type:'restoreConfirm'});
  }catch(err){
    showImportMsg('Could not read that file: '+humanizeError(err)+'. Your existing data has not been changed.', true);
  }
  e.target.value = '';
}
async function performRestore(){
  if(!pendingRestoreData) return;
  const incoming = pendingRestoreData;
  // Safety net: snapshot what's currently here BEFORE touching anything, in case the
  // wrong file was picked. This download does not count as a "real" backup.
  try{ doExport('safety'); }catch(e){}

  for(const k of KEYS){
    if(k in incoming){
      DB[k] = incoming[k];
      try{ await save(k); }catch(e){}
    }
  }
  // Preserve any keys the backup has that this app version doesn't recognize yet
  // (e.g. a backup made by a newer version) rather than silently discarding them.
  if(localStorageOK){
    Object.keys(incoming).forEach(k=>{
      if(!KEYS.includes(k)){
        try{ localStorage.setItem('db:'+k, JSON.stringify(incoming[k])); }catch(e){}
      }
    });
  }
  pendingRestoreData = null;
  modal = {type:'restoreSuccess'};
  render();
}

function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function daysBetween(aIso,bIso){ return Math.round((new Date(bIso+'T00:00:00') - new Date(aIso+'T00:00:00'))/86400000); }
function renderSeasonBanner(){

  if(!s) return '';
  const today = todayISO();
  const total = daysBetween(s.start, s.end);
  const elapsed = Math.min(Math.max(daysBetween(s.start, today),0), total);
  const pct = total>0 ? Math.round(elapsed/total*100) : 0;
  const daysLeft = Math.max(daysBetween(today, s.end), 0);
  return `<button data-nav-seasons style="all:unset; display:block; width:100%; cursor:pointer;">
  <div class="season-card">
    <div class="tag">🌱 Season ${String(s.number).padStart(2,'0')} — ${esc(s.name)}</div>
    <h3>${esc(s.focus||'')}</h3>
    <div class="bar-track" style="background:var(--cream-2);"><div class="bar-fill" style="background:var(--dash); width:${pct}%"></div></div>
    <p style="margin-top:8px;">${fmtDate(s.start)} → ${fmtDate(s.end)} · ${daysLeft>0 ? daysLeft+' days left in this season' : 'Season complete — start the next one in Seasons'}</p>
  </div></button>`;
}

/* ================= CUSTOM ROUTINES ================= */
const WEEKDAY_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function routineChecklistKey(routineId, stepId){ return checklistKey('cr:'+routineId, stepId); }
function isRoutineActiveOn(r, iso){
  if(r.frequency==='weekly') return (r.days||[]).includes(dayIdx(iso));
  return true; // daily and custom routines are always available to complete
}
function routineStepsDoneToday(r){
  const c = getChecklistFor(todayISO());
  return (r.steps||[]).filter(s=>c[routineChecklistKey(r.id,s.id)]).length;
}
function routineHistorySummary(r, daysBack){
  daysBack = daysBack || 14;
  let activeDays=0, completedDays=0;
  const d = new Date();
  for(let i=0;i<daysBack;i++){
    const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(isRoutineActiveOn(r, iso) && r.steps && r.steps.length){
      activeDays++;
      const c = DB.checklist[iso]||{};
      if(r.steps.every(s=>c[routineChecklistKey(r.id,s.id)])) completedDays++;
    }
    d.setDate(d.getDate()-1);
  }
  return {activeDays, completedDays};
}
let routineFormOpen = null; // null | 'new' | routineId being edited
let routineFormDays = [];
let routineFormSteps = [];
function openRoutineForm(editId){
  routineFormOpen = editId || 'new';
  const r = editId ? DB.customRoutines.find(x=>x.id===editId) : null;
  routineFormDays = r ? [...(r.days||[])] : [];
  routineFormSteps = r ? r.steps.map(s=>s.text) : [];
  render();
}
function closeRoutineForm(){ routineFormOpen = null; routineFormDays = []; routineFormSteps = []; render(); }
function renderRoutineStepRows(){
  return `<div id="routineStepsList">${routineFormSteps.map((text,idx)=>`
    <div class="check-row" style="border-bottom:1px solid var(--cream-2);">
      <input type="text" class="routine-step-text" data-step-idx="${idx}" value="${esc(text)}" style="flex:1; border:none; background:none; font-size:15px; padding:4px 0;">
      <button type="button" data-step-up="${idx}" class="icon-btn" ${idx===0?'disabled':''}>↑</button>
      <button type="button" data-step-down="${idx}" class="icon-btn" ${idx===routineFormSteps.length-1?'disabled':''}>↓</button>
      <button type="button" data-step-remove="${idx}" class="del">✕</button>
    </div>`).join('')}
    <div class="add-item-row"><input type="text" placeholder="Add a step" id="newStepInput"><button type="button" id="addStepBtn">Add</button></div>
  </div>`;
}
function syncStepsFromDOM(){
  document.querySelectorAll('.routine-step-text').forEach(inp=>{ routineFormSteps[Number(inp.dataset.stepIdx)] = inp.value; });
}
function refreshRoutineStepsList(){
  const container = document.getElementById('routineStepsList');
  if(!container) return;
  container.outerHTML = renderRoutineStepRows();
  wireRoutineStepRows();
}
function wireRoutineStepRows(){
  document.querySelectorAll('[data-step-up]').forEach(b=> b.onclick = ()=>{
    syncStepsFromDOM();
    const i = Number(b.dataset.stepUp);
    if(i>0){ [routineFormSteps[i-1],routineFormSteps[i]] = [routineFormSteps[i],routineFormSteps[i-1]]; }
    refreshRoutineStepsList();
  });
  document.querySelectorAll('[data-step-down]').forEach(b=> b.onclick = ()=>{
    syncStepsFromDOM();
    const i = Number(b.dataset.stepDown);
    if(i<routineFormSteps.length-1){ [routineFormSteps[i+1],routineFormSteps[i]] = [routineFormSteps[i],routineFormSteps[i+1]]; }
    refreshRoutineStepsList();
  });
  document.querySelectorAll('[data-step-remove]').forEach(b=> b.onclick = ()=>{
    syncStepsFromDOM();
    routineFormSteps.splice(Number(b.dataset.stepRemove),1);
    refreshRoutineStepsList();
  });
  const addBtn = document.getElementById('addStepBtn');
  if(addBtn) addBtn.onclick = ()=>{
    syncStepsFromDOM();
    const input = document.getElementById('newStepInput');
    const v = input.value.trim(); if(!v) return;
    routineFormSteps.push(v);
    refreshRoutineStepsList();
    const newInput = document.getElementById('newStepInput'); if(newInput) newInput.focus();
  };
}
function saveRoutineForm(editId, name, area, frequency, days, stepsText){
  name = (name||'').trim();
  if(!name) return;
  const lines = (stepsText||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const existing = editId ? DB.customRoutines.find(x=>x.id===editId) : null;
  const prevSteps = existing ? (existing.steps||[]) : [];
  const steps = lines.map(text=>{
    const match = prevSteps.find(ps=> ps.text.toLowerCase()===text.toLowerCase());
    return { id: match ? match.id : uid(), text };
  });
  if(existing){
    existing.name = name; existing.area = area; existing.frequency = frequency; existing.days = days||[]; existing.steps = steps;
  } else {
    DB.customRoutines.push({ id:uid(), name, area, frequency, days: days||[], steps, archived:false, createdAt: todayISO() });
  }
  save('customRoutines');
  closeRoutineForm();
  showToast(existing ? '🌿 Routine updated' : '🌱 Routine created');
}
function archiveRoutine(id, archived){ const r=DB.customRoutines.find(x=>x.id===id); if(r){ r.archived=archived; save('customRoutines'); render(); } }
function deleteRoutineForever(id){ DB.customRoutines = DB.customRoutines.filter(x=>x.id!==id); save('customRoutines'); render(); }
function moveRoutine(id, dir){
  const arr = DB.customRoutines;
  const idx = arr.findIndex(x=>x.id===id);
  const swapIdx = dir==='up' ? idx-1 : idx+1;
  if(idx<0 || swapIdx<0 || swapIdx>=arr.length) return;
  [arr[idx], arr[swapIdx]] = [arr[swapIdx], arr[idx]];
  save('customRoutines'); render();
}
function toggleRoutineStep(routineId, stepId){
  const iso = todayISO();
  const c = getChecklistFor(iso);
  const key = routineChecklistKey(routineId, stepId);
  c[key] = !c[key];
  save('checklist'); render();
}
function completeRoutineAll(routineId){
  const r = DB.customRoutines.find(x=>x.id===routineId); if(!r) return;
  const c = getChecklistFor(todayISO());
  r.steps.forEach(s=> c[routineChecklistKey(r.id,s.id)] = true);
  save('checklist'); render();
  showToast('🌱 Routine complete for today');
}
function areaBadge(areaKey){

}

        ${compareImgs.map(p=>`<div style="flex:1;"><img src="${p.photoData}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;"><div class="sub" style="text-align:center;margin-top:4px;">${fmtDate(p.date)}</div></div>`).join('')}

async function handleProgressPhotoFileChange(input){
  const file = input.files && input.files[0];
  const preview = document.getElementById('ppPhotoPreview');
  const saveBtn = document.getElementById('progPhotoSaveBtn');
  if(!file) return;
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Processing photo...'; }
  if(preview) preview.innerHTML = `<div class="sub">Processing photo...</div>`;
  try{
    const dataUrl = await compressImageFile(file, 640);
    qaTemp.ppPhotoData = dataUrl;
    if(preview) preview.innerHTML = `<img src="${dataUrl}" style="width:100%;border-radius:12px;">`;
  }catch(e){
    if(preview) preview.innerHTML = `<div class="sub" style="color:#B6607D;">Could not process that photo.</div>`;
  }finally{
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'Save Photo'; }
  }
}
function saveProgressPhoto(){
  if(!qaTemp.ppPhotoData) return;
  const date = document.getElementById('pp_date').value || todayISO();
  const area = document.getElementById('pp_area').value;
  const category = document.getElementById('pp_category').value;
  const note = document.getElementById('pp_note').value.trim();
  const tags = document.getElementById('pp_tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  DB.progressPhotos.push({ id:uid(), photoData: qaTemp.ppPhotoData, date, area, category, note, tags, seasonId: (currentSeason()||{}).id });
  save('progressPhotos');
  qaTemp.ppPhotoData = null;
  progressPhotoFormOpen = false;
  render();
}

const SEARCH_TYPES = ['goal','routine','milestone','reflection','journal','memory','season','achievement','relationship'];
function buildSearchIndex(){
  const idx = [];
  DB.goals.forEach(g=> idx.push({type:'goal', icon:'🎯', title:g.name, sub:g.completed?'Completed goal':'Goal in progress', date:g.completedAt?g.completedAt.slice(0,10):(g.deadline||''), area:g.area||'', seasonId:g.seasonId||'', navTab:'goals'}));

  DB.milestones.forEach(m=> idx.push({type:'milestone', icon:'🏵️', title:m.title, sub:m.description||'Milestone', date:m.date, area:m.area||'', seasonId:m.seasonId||'', navTab:'area', navView:m.area}));
  DB.proudMoments.forEach(p=> idx.push({type:'journal', icon:'🌸', title:p.text, sub:'Proud moment', date:p.date, area:'mind', seasonId:'', navTab:'reflections'}));
  DB.weeklyReflections.forEach(r=> idx.push({type:'reflection', icon:'🌿', title:r.proud||r.wentWell||'Weekly reflection', sub:'Reflection', date:r.date, area:'mind', seasonId:'', navTab:'reflections'}));
  DB.identityStatements.forEach(i=> idx.push({type:'journal', icon:'🌿', title:'I am becoming someone who '+i.text, sub:'Identity statement', date:i.date, area:'mind', seasonId:'', navTab:'identity'}));
  DB.reading.forEach(r=> idx.push({type:'journal', icon:'📖', title:r.passage||'Reading', sub:r.impression||'Moral reading', date:r.date, area:'faith', seasonId:'', navTab:'life', navView:'moral'}));
  DB.photos.forEach(p=> idx.push({type:'memory', icon:'📸', title:p.caption? p.caption.slice(0,60) : 'Photo of the Day', sub:'Memory', date:p.date, area:'life', seasonId:'', navTab:'memories'}));
  DB.relationships.forEach(r=> idx.push({type:'relationship', icon:'❤️', title:r.title, sub:(r.name||'')+(r.note?' — '+r.note:''), date:r.date, area:'relationships', seasonId:'', navTab:'relationships'}));
  DB.seasons.forEach(s=> idx.push({type:'season', icon:'🌱', title:'Season '+String(s.number).padStart(2,'0')+' — '+s.name, sub:s.focus||'Season', date:s.start, area:'', seasonId:s.id, navTab:'seasons'}));
  DB.achievements.forEach(a=> idx.push({type:'achievement', icon:a.icon||'🏆', title:a.title, sub:a.description||'Achievement', date:a.date, area:'', seasonId:'', navTab:'achievements'}));
  DB.progressPhotos.forEach(p=> idx.push({type:'memory', icon:'📸', title:(p.category||'Photo')+(p.note?': '+p.note:''), sub:'Progress photo', date:p.date, area:p.area||'', seasonId:p.seasonId||'', navTab:'progressphotos'}));
  return idx;
}
function getFilteredSearchResults(){
  let results = buildSearchIndex();
  const q = searchQuery.trim().toLowerCase();
  if(q) results = results.filter(r=> (r.title+' '+r.sub).toLowerCase().includes(q));
  if(searchAreaFilter) results = results.filter(r=> r.area===searchAreaFilter);
  if(searchTypeFilter) results = results.filter(r=> r.type===searchTypeFilter);
  if(searchSeasonFilter) results = results.filter(r=> r.seasonId===searchSeasonFilter);
  if(searchDateFrom) results = results.filter(r=> r.date && r.date>=searchDateFrom);
  if(searchDateTo) results = results.filter(r=> r.date && r.date<=searchDateTo);
  return results.sort((a,b)=> (b.date||'').localeCompare(a.date||'')).slice(0,80);
}

  </div>`;
}

      <input type="range" min="1" max="99" value="${thenNowSlider}" id="thenNowRange" style="width:100%; margin-top:10px; accent-color:var(--dash);">
      ${older.note || newer.note ? `<div style="margin-top:10px;">
        ${older.note?`<div class="sub"><strong>Then:</strong> ${esc(older.note)}</div>`:''}
        ${newer.note?`<div class="sub" style="margin-top:4px;"><strong>Now:</strong> ${esc(newer.note)}</div>`:''}
      </div>` : ''}
      ${(older.tags&&older.tags.length)||(newer.tags&&newer.tags.length) ? `<div class="chip-row" style="margin-top:10px;">${[...(older.tags||[]),...(newer.tags||[])].map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>` : ''}
    </div>` : ''}` }
  </div>`;
}

/* ================= ROUTINE DRAG REORDER ================= */
function applyRoutineOrder(idsInOrder){
  const byId = {}; DB.customRoutines.forEach(r=> byId[r.id]=r);
  const reordered = idsInOrder.map(id=>byId[id]).filter(Boolean);
  // keep any routine not present in idsInOrder (shouldn't normally happen) appended at the end
  DB.customRoutines.forEach(r=>{ if(!idsInOrder.includes(r.id)) reordered.push(r); });
  DB.customRoutines = reordered;
  save('customRoutines');
}
function wireRoutineDrag(app){
  const list = app.querySelector('#routinesList');
  if(!list) return;
  let dragEl = null, startY = 0, startTransform = 0;
  const cards = ()=> Array.from(list.querySelectorAll('[data-routine-card]'));
  list.querySelectorAll('[data-drag-handle]').forEach(handle=>{
    handle.addEventListener('pointerdown', (e)=>{
      dragEl = handle.closest('[data-routine-card]');
      if(!dragEl) return;
      startY = e.clientY;
      dragEl.style.zIndex = 5;
      dragEl.style.position = 'relative';
      if(handle.setPointerCapture) handle.setPointerCapture(e.pointerId);
      const onMove = (ev)=>{
        const dy = ev.clientY - startY;
        dragEl.style.transform = `translateY(${dy}px)`;
        const siblings = cards().filter(c=>c!==dragEl);
        for(const sib of siblings){
          const rect = sib.getBoundingClientRect();
          const dragRect = dragEl.getBoundingClientRect();
          const dragMid = dragRect.top + dragRect.height/2;
          if(dragMid > rect.top && dragMid < rect.bottom){
            if(dragRect.top < rect.top) sib.after(dragEl); else sib.before(dragEl);
            dragEl.style.transform = 'translateY(0px)';
            startY = ev.clientY;
            break;
          }
        }
      };
      const onUp = ()=>{
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        if(dragEl){ dragEl.style.transform=''; dragEl.style.zIndex=''; }
        const newOrder = cards().map(c=>c.dataset.routineCard);
        applyRoutineOrder(newOrder);
        render();
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });
}

/* ---------------- init ---------------- */
(async function init(){
  await loadAll();
  checkAllAchievements(); // retroactively grants any milestones already met by existing data
  render();
})();

// Register service worker for offline support + PWA installability.
// Silently no-ops if unsupported or unreachable (e.g. running from a raw file:// path) —
// the app itself never depends on this succeeding.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
